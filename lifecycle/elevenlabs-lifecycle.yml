breaking_changes_policy:
  published: true
  url: https://elevenlabs.io/docs/eleven-api/resources/breaking-changes-policy
  breaking:
  - Removing existing response fields or modifying their structure
  - Adding required parameters to existing endpoints
  - Changing parameter types or formats
  - Making a previously optional parameter required
  - Removing an endpoint or API path
  not_breaking:
  - Adding new fields to response models (clients MUST ignore unrecognised fields)
  - Adding optional parameters or parameters with defaults
  client_obligation: The provider states it is REQUIRED that an API client ignores fields it does not
    recognise and does not apply strict typing checks to responses.
  removal_commitment: Endpoints may be marked deprecated; outright removal "will not occur without sufficient
    outreach to all affected users". No numeric sunset window is published.
