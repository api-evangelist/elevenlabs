apis:
- aid: elevenlabs:elevenlabs-api
  name: ElevenLabs API
  description: >-
    The complete ElevenLabs REST API as the provider publishes it — one OpenAPI 3.1.0
    document covering 301 paths and 390 operations across ElevenCreative (text to speech,
    speech to text, voice changer, voice cloning and design, music, sound effects, audio
    isolation, dubbing, Studio, image and video), ElevenAgents (agents, conversations,
    knowledge base, tools, telephony, batch calling, testing) and workspace administration.
    Served first-party at https://api.elevenlabs.io/openapi.json and advertised from the
    provider's own RFC 9727 /.well-known/api-catalog linkset. The 22 per-product API entries
    below are tag-split refinements of this same surface.
