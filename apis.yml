description: >-
  ElevenLabs is an AI research and product company building voice and audio models, founded
  in 2022 and launched publicly in January 2023 with the first human-like AI voice model. It
  sells across three platforms: ElevenCreative (text to speech, speech to text, voice cloning
  and design, music, sound effects, dubbing, Studio, image and video across 70+ languages),
  ElevenAgents (an enterprise platform for voice and chat agents with telephony, testing,
  evaluation and analytics), and ElevenAPI (direct developer access to the audio foundation
  models over HTTP and WebSocket). It publishes a single first-party OpenAPI 3.1.0 covering
  390 operations, official SDKs for Python, JavaScript, React, React Native, Swift, Kotlin
  and Flutter, a Rust CLI, a hosted remote MCP server with four data-residency endpoints, and
  ten Agent Skills of its own.
