format_note: NOT RFC 9457. ElevenLabs returns application/json with a single top-level `detail` object;
  no application/problem+json media type and no type/title/status/detail/instance member set. The envelope
  carries type, code, message, status (legacy, deprecated by the provider), request_id and param.
envelope:
  media_type: application/json
  root_field: detail
  fields:
  - name: type
    description: Error class. One of the ten values in types[].
  - name: code
    description: Specific machine-readable code. More granular than type; use this to branch.
  - name: message
    description: Human-readable explanation.
  - name: status
    description: Legacy field, no longer used. The provider says to use code instead.
    deprecated: true
  - name: request_id
    description: Unique request identifier. Include it when contacting team@elevenlabs.io.
  - name: param
    description: The offending parameter on a validation error.
  example:
    detail:
      type: validation_error
      code: invalid_parameters
      message: The 'keyterms' parameter is only supported with the 'scribe_v2' model. You specified 'scribe_v1'.
      status: invalid_parameters
      request_id: 3c807fc4c3a1705f9638ecc764a91c01
      param: keyterms
  example_source: https://elevenlabs.io/docs/eleven-api/resources/errors
