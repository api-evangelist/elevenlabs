throttling:
  http_status: 429
  codes:
  - rate_limit_exceeded
  - concurrent_limit_exceeded
  guidance: rate_limit_exceeded means too many requests in a window — implement exponential backoff. concurrent_limit_exceeded
    means the plan concurrency ceiling was hit — wait for in-flight requests to finish. See rate-limits/elevenlabs-rate-limits.yml.
