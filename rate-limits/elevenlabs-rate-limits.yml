notes:
- Startup grant recipients receive Scale-level concurrency benefits.
- ElevenAgents adds a separate concurrency dimension — simultaneous calls per agent — with
  burst pricing and call queueing as the documented overflow behaviour
  (https://elevenlabs.io/docs/eleven-agents/guides/burst-pricing and .../call-queueing).
- An individual API key can carry its own credit quota and IP allowlist independent of the
  plan ceiling (see authentication/elevenlabs-authentication.yml).
