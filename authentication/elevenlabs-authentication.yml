spec_gap:
  observed: |
    The provider's own published OpenAPI (https://api.elevenlabs.io/openapi.json, 301 paths /
    390 operations) declares NO components.securitySchemes and applies no security to any
    operation, even though every endpoint requires the xi-api-key header. The auth model is
    documented in prose and in the OAuth discovery documents, not in the contract.
  impact: an agent reading only the spec cannot tell how to authenticate.
  remediation: add an apiKey securityScheme (header, xi-api-key) to components and a
    top-level security requirement.
