id_convention:
  style: opaque string identifiers, no type prefix
  note: |
    Unlike Stripe-shaped APIs, ElevenLabs identifiers carry no type prefix — a voice_id
    (e.g. JBFqnCBsd6RMkjVDRZzb) and an agent_id (e.g. agent_7101k5zvyjhmfg983brhmhkd98n6)
    do not share a scheme, and most ids are bare opaque strings. Agent identifiers observed
    in the widget docs DO carry an `agent_` prefix; that is the only prefixed family seen.
  no_published_id_reference: the docs publish no object/id reference page, so prefix rules
    cannot be stated beyond what appears in examples.
