openapi: 3.2.0
info:
  title: Elevenlabs Voices API
  version: '1.0'
  description: 'Operations tagged voices across 2 of this provider''s published API definitions: elevenlabs-openapi.json, elevenlabs-voices-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.elevenlabs.io
  description: Production Server
tags:
- name: Voices
  description: Access to voices created either by you or ElevenLabs.
paths:
  /v1/voices/settings/default:
    get:
      tags:
      - Voices
      summary: Get Default Voice Settings
      description: Gets the default settings for voices. "similarity_boost" corresponds to"Clarity + Similarity Enhancement" in the web app and "stability" corresponds to "Stability" slider in the web app.
      operationId: get_voice_settings_default
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSettingsResponseModel'
      x-fern-sdk-group-name:
      - voices
      - settings
      x-fern-sdk-method-name: get_default
  /v1/voices/{voice_id}/settings:
    get:
      tags:
      - Voices
      summary: Get Voice Settings
      description: Returns the settings for a specific voice. "similarity_boost" corresponds to"Clarity + Similarity Enhancement" in the web app and "stability" corresponds to "Stability" slider in the web app.
      operationId: get_voice_settings
      parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
          examples:
          - 21m00Tcm4TlvDq8ikWAM
          title: Voice Id
        description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSettingsResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - voices
      - settings
      x-fern-sdk-method-name: get
  /v1/voices/{voice_id}/settings/edit:
    post:
      tags:
      - Voices
      summary: Edit Voice Settings
      description: Edit your settings for a specific voice. "similarity_boost" corresponds to "Clarity + Similarity Enhancement" in the web app and "stability" corresponds to "Stability" slider in the web app.
      operationId: edit_voice_settings
      parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
          examples:
          - 21m00Tcm4TlvDq8ikWAM
          title: Voice Id
        description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceSettingsResponseModel'
              description: The settings for a specific voice.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditVoiceSettingsResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - voices
      - settings
      x-fern-sdk-method-name: update
  /v1/voices/accents:
    get:
      tags:
      - Voices
      summary: Get Voice Accents
      description: Gets the list of available accents in the shared voice library.
      operationId: get_voice_accents
      parameters:
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: If provided, only accents for this language code are returned.
          examples:
          - en
          title: Language
        description: If provided, only accents for this language code are returned.
      - name: model_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: If provided, returns the accents available for this model. Defaults to the most complete accent list when omitted.
          examples:
          - eleven_v3
          title: Model Id
        description: If provided, returns the accents available for this model. Defaults to the most complete accent list when omitted.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVoiceAccentsResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - voices
      - accents
      x-fern-sdk-method-name: get
  /v1/voices:
    get:
      tags:
      - Voices
      summary: List Voices
      description: Returns a list of all available voices for a user. Stops working once the user's workspace exceeds 500 voices.
      operationId: get_voices
      parameters:
      - name: show_legacy
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: If set to true, legacy premade voices will be included in responses from /v1/voices
          examples:
          - true
          default: false
          title: Show Legacy
        description: If set to true, legacy premade voices will be included in responses from /v1/voices
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVoicesResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: voices
      x-fern-sdk-method-name: get_all
  /v1/voices/{voice_id}:
    get:
      tags:
      - Voices
      summary: Get Voice
      description: Returns metadata about a specific voice.
      operationId: get_voice_by_id
      parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
          examples:
          - 21m00Tcm4TlvDq8ikWAM
          title: Voice Id
        description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
      - name: with_settings
        in: query
        required: false
        schema:
          type: boolean
          description: This parameter is now deprecated. It is ignored and will be removed in a future version.
          deprecated: true
          default: true
          title: With Settings
        description: This parameter is now deprecated. It is ignored and will be removed in a future version.
        deprecated: true
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: voices
      x-fern-sdk-method-name: get
    delete:
      tags:
      - Voices
      summary: Delete Voice
      description: Deletes a voice by its ID.
      operationId: delete_voice
      parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
          examples:
          - 21m00Tcm4TlvDq8ikWAM
          title: Voice Id
        description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteVoiceResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: voices
      x-fern-sdk-method-name: delete
  /v1/voices/{voice_id}/edit:
    post:
      tags:
      - Voices
      summary: Edit Voice
      description: Edit a voice created by you.
      operationId: edit_voice
      parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
          examples:
          - 21m00Tcm4TlvDq8ikWAM
          title: Voice Id
        description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Edit_voice_v1_voices__voice_id__edit_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditVoiceResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: voices
      x-fern-sdk-method-name: update
  /v2/voices:
    get:
      tags:
      - Voices
      summary: Get Voices V2
      description: Gets a list of all available voices for a user with search, filtering and pagination.
      operationId: get_user_voices_v2
      parameters:
      - name: next_page_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The next page token to use for pagination. Returned from the previous request. Use this in combination with the has_more flag for reliable pagination.
          examples:
          - '0'
          title: Next Page Token
        description: The next page token to use for pagination. Returned from the previous request. Use this in combination with the has_more flag for reliable pagination.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: How many voices to return at maximum. Can not exceed 100, defaults to 10. Page 0 may include more voices due to default voices being included.
          default: 10
          title: Page Size
        description: How many voices to return at maximum. Can not exceed 100, defaults to 10. Page 0 may include more voices due to default voices being included.
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search term to filter voices by. Searches in name, description, labels, category.
          title: Search
        description: Search term to filter voices by. Searches in name, description, labels, category.
      - name: sort
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Which field to sort by, one of 'created_at_unix' or 'name'. 'created_at_unix' may not be available for older voices.
          examples:
          - created_at_unix
          title: Sort
        description: Which field to sort by, one of 'created_at_unix' or 'name'. 'created_at_unix' may not be available for older voices.
      - name: sort_direction
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Which direction to sort the voices in. 'asc' or 'desc'.
          examples:
          - desc
          title: Sort Direction
        description: Which direction to sort the voices in. 'asc' or 'desc'.
      - name: voice_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Type of the voice to filter by. One of 'personal', 'community', 'default', 'workspace', 'non-default', 'non-community', 'saved'. 'non-default' is equal to all but 'default'. 'non-community' is equal to 'personal' and 'workspace' combined (excludes library copies). 'saved' is equal to non-default, but includes default voices if they have been added to a collection.
          title: Voice Type
        description: Type of the voice to filter by. One of 'personal', 'community', 'default', 'workspace', 'non-default', 'non-community', 'saved'. 'non-default' is equal to all but 'default'. 'non-community' is equal to 'personal' and 'workspace' combined (excludes library copies). 'saved' is equal to non-default, but includes default voices if they have been added to a collection.
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Category of the voice to filter by. One of 'premade', 'cloned', 'generated', 'professional'
          title: Category
        description: Category of the voice to filter by. One of 'premade', 'cloned', 'generated', 'professional'
      - name: fine_tuning_state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: State of the voice's fine tuning to filter by. Applicable only to professional voices clones. One of 'draft', 'not_verified', 'not_started', 'queued', 'fine_tuning', 'fine_tuned', 'failed', 'delayed'
          title: Fine Tuning State
        description: State of the voice's fine tuning to filter by. Applicable only to professional voices clones. One of 'draft', 'not_verified', 'not_started', 'queued', 'fine_tuning', 'fine_tuned', 'failed', 'delayed'
      - name: collection_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Collection ID to filter voices by.
          title: Collection Id
        description: Collection ID to filter voices by.
      - name: gender
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Gender used for filtering, based on the voice's 'gender' label.
          examples:
          - male
          title: Gender
        description: Gender used for filtering, based on the voice's 'gender' label.
      - name: age
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Age used for filtering, based on the voice's 'age' label.
          examples:
          - young
          title: Age
        description: Age used for filtering, based on the voice's 'age' label.
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Languages used for filtering, based on the voice's 'language' label. Voices matching any of the given languages are returned.
          examples:
          - - en
            - es
          title: Language
        description: Languages used for filtering, based on the voice's 'language' label. Voices matching any of the given languages are returned.
      - name: accent
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Accent used for filtering, based on the voice's 'accent' label.
          examples:
          - american
          title: Accent
        description: Accent used for filtering, based on the voice's 'accent' label.
      - name: use_cases
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Use cases used for filtering, based on the voice's 'use_case' label. Voices matching any of the given use cases are returned.
          examples:
          - - conversational
            - narrative_story
          title: Use Cases
        description: Use cases used for filtering, based on the voice's 'use_case' label. Voices matching any of the given use cases are returned.
      - name: min_notice_period_days
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter to voices whose sharing notice period is at least the given number of days.
          examples:
          - 30
          title: Min Notice Period Days
        description: Filter to voices whose sharing notice period is at least the given number of days.
      - name: include_custom_rates
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether to include voices that have a custom sharing rate. Defaults to including them.
          examples:
          - true
          title: Include Custom Rates
        description: Whether to include voices that have a custom sharing rate. Defaults to including them.
      - name: include_live_moderated
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether to include voices that have live moderation enabled. Defaults to including them.
          examples:
          - true
          title: Include Live Moderated
        description: Whether to include voices that have live moderation enabled. Defaults to including them.
      - name: high_quality
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: When true, only return studio-quality voices (those whose category is 'high_quality').
          examples:
          - true
          title: High Quality
        description: When true, only return studio-quality voices (those whose category is 'high_quality').
      - name: include_total_count
        in: query
        required: false
        schema:
          type: boolean
          description: 'Whether to include the total count of voices found in the response. NOTE: The total_count value is a live snapshot and may change between requests as users create, modify, or delete voices. For pagination, rely on the has_more flag instead. Only enable this when you actually need the total count (e.g., for display purposes), as it incurs a performance cost.'
          examples:
          - true
          default: true
          title: Include Total Count
        description: 'Whether to include the total count of voices found in the response. NOTE: The total_count value is a live snapshot and may change between requests as users create, modify, or delete voices. For pagination, rely on the has_more flag instead. Only enable this when you actually need the total count (e.g., for display purposes), as it incurs a performance cost.'
      - name: voice_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Voice IDs to lookup by. Maximum 100 voice IDs.
          title: Voice Ids
        description: Voice IDs to lookup by. Maximum 100 voice IDs.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVoicesV2ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: voices
      x-fern-sdk-method-name: search
  /v1/voices/{voice_id}/replicate-to-isolated-environment:
    post:
      tags:
      - Voices
      summary: Replicate Voice To Isolated Environment
      description: Replicates an Instant Voice Clone or Voice Design voice to a workspace in a different data residency. The target workspace must belong to the same consolidated billing group. The user must have VOICES_WRITE in the source workspace, and be an admin on the source voice. Human users (i.e. not service accounts) must also have VOICES_WRITE in the target workspace. This endpoint is available on the central environment only.
      operationId: replicate_voice_to_isolated_environment
      parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
          examples:
          - 21m00Tcm4TlvDq8ikWAM
          title: Voice Id
        description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplicateVoiceToIsolatedEnvironmentRequestModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicateVoiceToIsolatedEnvironmentResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: voices
      x-fern-sdk-method-name: replicate_to_isolated_environment
  /v1/voices/add:
    post:
      tags:
      - Voices
      summary: Add Voice
      description: Add a new voice to your collection of voices in VoiceLab.
      operationId: add_voice
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Add_voice_v1_voices_add_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddVoiceIVCResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - voices
      - ivc
      x-fern-sdk-method-name: create
  /v1/voices/add/{public_user_id}/{voice_id}:
    post:
      tags:
      - Voices
