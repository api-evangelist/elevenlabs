      properties:
        id:
          type: string
          title: Id
          description: The unique identifier for the evaluation criteria
        name:
          type: string
          title: Name
        type:
          type: string
          const: prompt
          title: Type
          description: The type of evaluation criteria
          default: prompt
        conversation_goal_prompt:
          type: string
          maxLength: 2000
          title: Conversation Goal Prompt
          description: The prompt that the agent should use to evaluate the conversation
        use_knowledge_base:
          type: boolean
          title: Use Knowledge Base
          description: When evaluating the prompt, should the agent's knowledge base be used.
          default: false
        scope:
          $ref: '#/components/schemas/AnalysisScope'
          description: The scope of transcript context used when evaluating this criterion. 'conversation' uses the full transcript; 'agent' uses only the portion where the defining agent was active.
          default: conversation
        llm:
          anyOf:
          - $ref: '#/components/schemas/LLM'
          - type: 'null'
          description: LLM model to use for this evaluation criteria. If not set, uses agent's analysis_llm default.
        scoring_mode:
          $ref: '#/components/schemas/CriteriaScoringMode'
          description: How this criterion is scored. 'binary' resolves to success/failure/unknown. 'numeric_uniform' returns a number on the [0, max_score] scale which is normalized into the aggregate conversation success percentage.
          default: binary
        max_score:
          type: integer
          title: Max Score
          description: Maximum value of the numeric score scale (minimum is always 0). Only used when scoring_mode is 'numeric_uniform'.
          default: 100
        score_instructions:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Score Instructions
          description: Optional free-text instructions describing how to assign values on the numeric scale. Only used when scoring_mode is 'numeric_uniform'.
      type: object
      required:
      - id
      - name
      - conversation_goal_prompt
      title: PromptEvaluationCriteria
      description: An evaluation using the transcript and a prompt for a yes/no achieved answer
      examples:
      - conversation_goal_prompt: Determine whether the agent fully resolved the user's issue.
        id: criterion_binary_001
        max_score: 100
        name: Issue resolved
        scope: conversation
        scoring_mode: binary
        use_knowledge_base: false
      - conversation_goal_prompt: Rate how completely and correctly the issue was resolved.
        id: criterion_numeric_001
        max_score: 100
        name: Resolution quality
        scope: conversation
        score_instructions: 0 means unresolved, 50 means partially resolved, 100 means fully resolved with correct details.
        scoring_mode: numeric_uniform
        use_knowledge_base: false
