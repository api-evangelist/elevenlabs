          title: Enable Phoneme Tags
          description: Opt-in to SSML phoneme tag handling for V3 models. When enabled, phoneme tags (inline and from pronunciation dictionaries) are parsed into inline IPA before being sent to the model.
          default: true
        audio_effects:
          anyOf:
          - $ref: '#/components/schemas/EffectsSpec-Input'
          - type: 'null'
          description: 'Optional TTS effects spec: filter preset, distance (proximity EQ), and environment (convolution reverb).'
      type: object
      title: TTSConversationalConfig
      example:
