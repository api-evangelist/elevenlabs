    CustomGuardrailConfig:
      properties:
        is_enabled:
          type: boolean
          title: Is Enabled
          default: false
        name:
          type: string
          maxLength: 500
          minLength: 1
          title: Name
          description: User-facing name for this guardrail
        prompt:
          type: string
          maxLength: 10000
          minLength: 1
          title: Prompt
          description: Instruction describing what to block, e.g. 'don't talk about politics'
        execution_mode:
          $ref: '#/components/schemas/GuardrailExecutionMode'
          default: streaming
        model:
          type: string
          enum:
          - gemini-2.5-flash-lite
          - gemini-2.5-flash
          - gemini-3.1-flash-lite
          - gemini-3.5-flash
          - claude-haiku-4-5
          - claude-sonnet-4-6
          - gpt-5.4-nano
          - gpt-5.4-mini
          title: Model
          description: LLM model to use for custom guardrail evaluation
          default: gemini-3.1-flash-lite
        history_message_count:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: History Message Count
          description: How much recent history the guardrail sees before the reply it evaluates, counted in user messages (the agent replies between them are included too). The guardrail always gets a single <conversation_history> transcript ending in the evaluated reply, marked 'AGENT [current reply]:'. 0 (default) adds no prior history (just that line); 1 adds the latest user message onward.
          default: 0
        history_include_tool_calls:
          type: boolean
          title: History Include Tool Calls
          description: 'When enabled, the history also renders the agent''s tool calls, their input arguments, and the tool results, interleaved with the text, so an action between two agent messages is visible. Off by default: history shows only user and agent text. Tool payloads can be large and can mislead smaller evaluator models, so enabling this raises token cost.'
          default: false
          x-fern-ignore: true
        trigger_action:
          oneOf:
          - $ref: '#/components/schemas/EndCallTriggerAction'
          - $ref: '#/components/schemas/RetryTriggerAction'
          title: Trigger Action
          discriminator:
            propertyName: type
            mapping:
              end_call: '#/components/schemas/EndCallTriggerAction'
              retry: '#/components/schemas/RetryTriggerAction'
        evaluate_full_response_only:
          type: boolean
          title: Evaluate Full Response Only
          description: Evaluate once against the complete non-TTS response instead of cumulative partials. Requires blocking mode.
          default: false
      type: object
      required:
      - name
      - prompt
      title: CustomGuardrailConfig
      description: Single custom guardrail configuration
