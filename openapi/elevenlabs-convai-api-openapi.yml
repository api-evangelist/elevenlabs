          discriminator:
            propertyName: type
            mapping:
              phone: '#/components/schemas/PhoneNumberTransferDestination'
              phone_dynamic_variable: '#/components/schemas/PhoneNumberDynamicVariableTransferDestination'
              sip_uri: '#/components/schemas/SIPUriTransferDestination'
              sip_uri_dynamic_variable: '#/components/schemas/SIPUriDynamicVariableTransferDestination'
        transfer_type:
          $ref: '#/components/schemas/TransferTypeEnum'
          default: conference
        sip_refer_play_dialtone:
          type: boolean
          title: Sip Refer Play Dialtone
          description: When True, a ringing tone is played on the original call leg while a SIP REFER transfer completes. The tone is carried over RTP to the SIP peer executing the REFER, so disable this if the receiving system (e.g. an SBC or contact center) should not hear it. When disabled the caller hears silence until the transfer completes. SIP REFER transfers only.
          default: true
        uui:
          anyOf:
          - $ref: '#/components/schemas/UUITransferConfig'
          - type: 'null'
          description: User-to-User Information (RFC 7433) to attach to SIP REFER transfers. Carries call context such as CRM identifiers or escalation reason across the transfer boundary.
        post_dial_digits:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/PostDialDigitsStatic'
            - $ref: '#/components/schemas/PostDialDigitsDynamicVariable'
