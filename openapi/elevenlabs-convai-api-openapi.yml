    PromptAgentAPIModelWorkflowOverride-Input:
      properties:
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
          description: The prompt for the agent
          x-convai-client-override: true
        llm:
          anyOf:
          - $ref: '#/components/schemas/LLM'
          - type: 'null'
          description: The LLM to query with the prompt and the chat history. If using data residency, the LLM must be supported in the data residency environment
          x-convai-client-override: true
        reasoning_effort:
          anyOf:
          - $ref: '#/components/schemas/LLMReasoningEffort'
          - type: 'null'
          description: Reasoning effort of the model. Only available for some models.
        thinking_budget:
          anyOf:
          - type: integer
          - type: 'null'
          title: Thinking Budget
          description: Max number of tokens used for thinking. Use 0 to turn off if supported by the model.
        enable_reasoning_summary:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Reasoning Summary
          description: Enable model reasoning summaries. When disabled, we do not request summaries from provider if possible for faster TTFB. Not ZRM compatible.
        temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature
          description: The temperature for the LLM. Defaults to 0. Set to null to omit the parameter from the LLM request entirely (useful for custom LLMs that reject the temperature field).
        max_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Tokens
          description: If greater than 0, maximum number of tokens the LLM can predict
        tool_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tool Ids
          description: A list of IDs of tools used by the agent
          x-convai-client-override: true
        built_in_tools:
          anyOf:
          - $ref: '#/components/schemas/BuiltInToolsWorkflowOverride-Input'
          - type: 'null'
          description: Built-in system tools to be used by the agent
        enable_parallel_tool_calls:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Parallel Tool Calls
          description: Enable parallel tool calling. When enabled, the agent can execute multiple tools in parallel within a single turn. Not supported by all models.
        mcp_server_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Mcp Server Ids
          description: A list of MCP server ids to be used by the agent
        native_mcp_server_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Native Mcp Server Ids
          description: A list of Native MCP server ids to be used by the agent
          x-convai-client-override: true
        knowledge_base:
          anyOf:
          - items:
              $ref: '#/components/schemas/KnowledgeBaseLocator'
            type: array
          - type: 'null'
          title: Knowledge Base
          description: A list of knowledge bases to be used by the agent
          x-convai-client-override: true
        custom_llm:
          anyOf:
          - $ref: '#/components/schemas/CustomLLM'
          - type: 'null'
          description: Definition for a custom LLM if LLM field is set to 'CUSTOM_LLM'
        ignore_default_personality:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ignore Default Personality
          description: Whether to remove the default personality lines from the system prompt
        rag:
          anyOf:
          - $ref: '#/components/schemas/RagConfigWorkflowOverride-Input'
          - type: 'null'
          description: Configuration for RAG
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
          description: Timezone for displaying current time in system prompt. If set, the current time will be included in the system prompt using this timezone. Must be a valid timezone name (e.g., 'America/New_York', 'Europe/London', 'UTC'). Recommended for accurate time-aware responses; without this, the agent has no knowledge of the current date/time unless you provide it via dynamic variables or tools, which can lead to incorrect or hallucinated time references.
        backup_llm_config:
          anyOf:
          - $ref: '#/components/schemas/BackupLLMDefault'
          - $ref: '#/components/schemas/BackupLLMDisabled'
          - $ref: '#/components/schemas/BackupLLMOverride'
          - type: 'null'
          title: Backup Llm Config
          description: Configuration for backup LLM cascading. Can be disabled, use system defaults, or specify custom order.
        cascade_timeout_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Cascade Timeout Seconds
          description: Time in seconds before cascading to backup LLM. Must be between 2 and 15 seconds.
        tools:
          anyOf:
          - items:
              oneOf:
              - $ref: '#/components/schemas/WebhookToolConfig-Input'
              - $ref: '#/components/schemas/ClientToolConfig-Input'
              - $ref: '#/components/schemas/SystemToolConfig-Input'
              - $ref: '#/components/schemas/MCPToolConfig-Input'
              - $ref: '#/components/schemas/ApiIntegrationWebhookToolConfig-Input'
              - $ref: '#/components/schemas/SMBToolConfig'
              description: The type of tool
              discriminator:
                propertyName: type
                mapping:
                  api_integration_webhook: '#/components/schemas/ApiIntegrationWebhookToolConfig-Input'
                  client: '#/components/schemas/ClientToolConfig-Input'
                  mcp: '#/components/schemas/MCPToolConfig-Input'
                  smb: '#/components/schemas/SMBToolConfig'
                  system: '#/components/schemas/SystemToolConfig-Input'
                  webhook: '#/components/schemas/WebhookToolConfig-Input'
            type: array
          - type: 'null'
          title: Tools
          description: A list of tools that the agent can use over the course of the conversation, use tool_ids instead
      type: object
      title: PromptAgentAPIModelWorkflowOverride
      example:
        knowledge_base: []
        llm: gemini-2.0-flash-001
        max_tokens: -1
        prompt: You are a helpful assistant that can answer questions about the topic of the conversation.
        temperature: 0.0
        tool_ids: []
        tools: []
