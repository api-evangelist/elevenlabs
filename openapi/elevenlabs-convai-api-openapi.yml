components:
  schemas:
    ListProductsParams:
      properties:
        list_kwargs:
          additionalProperties: true
          type: object
          title: List Kwargs
        smb_tool_type:
          type: string
          const: list_products
          title: Smb Tool Type
          default: list_products
      type: object
      title: ListProductsParams
    KnowledgeBaseRagToolStatus:
      type: string
      enum:
      - success
      - no_documents
      - no_results
      title: KnowledgeBaseRagToolStatus
      default: success
    AgentConversationTicketIssueType:
      type: string
      enum:
      - knowledge_gap
      - incorrect_information
      - documentation_gap
      - product_feedback
      - platform_bug
      - tool_issue
      - missing_tool
      - unnecessary_escalation
      - wrong_action
      title: AgentConversationTicketIssueType
    TTSOptimizeStreamingLatency:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      title: TTSOptimizeStreamingLatency
    ConversationConfigOverrideConfig:
      properties:
        text_only:
          type: boolean
          title: Text Only
          description: Whether to allow overriding the text_only field.
          default: false
        max_duration_seconds:
          type: boolean
          title: Max Duration Seconds
          description: Whether to allow overriding the max_duration_seconds field.
          default: false
      type: object
      title: ConversationConfigOverrideConfig
    ToolErrorHandlingMode:
      type: string
      enum:
      - auto
      - summarized
      - passthrough
      - hide
      title: ToolErrorHandlingMode
      description: Controls how tool errors are processed before being shared with the agent.
      default: auto
    ASTLessThanOrEqualsOperatorNode-Input:
      properties:
        type:
          type: string
          const: lte_operator
          title: Type
          default: lte_operator
        left:
          $ref: '#/components/schemas/ASTNode-Input'
          description: Left operand of the binary operator.
        right:
          $ref: '#/components/schemas/ASTNode-Input'
          description: Right operand of the binary operator.
      type: object
      required:
      - left
      - right
      title: ASTLessThanOrEqualsOperatorNode
    WorkflowOverrideAgentNodeModel-Input:
      properties:
        type:
          type: string
          const: override_agent
          title: Type
          default: override_agent
        position:
          $ref: '#/components/schemas/Position-Input'
          description: Position of the node in the workflow.
        edge_order:
          items:
            type: string
          type: array
          title: Edge Order
          description: The ids of outgoing edges in the order they should be evaluated.
        conversation_config:
          $ref: '#/components/schemas/ConversationalConfigAPIModelWorkflowOverride-Input'
          description: Configuration overrides applied while the subagent is conducting the conversation.
        additional_prompt:
          type: string
          title: Additional Prompt
          description: Specific goal for this subagent. It will be added to the system prompt and can be used to further refine the agent's behavior in this specific context.
        additional_knowledge_base:
          items:
            $ref: '#/components/schemas/KnowledgeBaseLocator'
          type: array
          title: Additional Knowledge Base
          description: Additional knowledge base documents that the subagent has access to. These will be used in addition to the main agent's documents.
        additional_tool_ids:
          items:
            type: string
          type: array
          title: Additional Tool Ids
          description: IDs of additional tools that the subagent has access to. These will be used in addition to the main agent's tools.
        label:
          type: string
          title: Label
          description: Human-readable label for the node used throughout the UI.
        entry_behavior:
          $ref: '#/components/schemas/EntryBehavior'
          description: 'Dictates whether this node should immediately generate a response upon entry or wait for the user input. When set to "auto", the behavior will be decided based on the type of the preceding node: "wait_for_user" after the "say" and "start" nodes and "generate_immediately" otherwise.'
          default: auto
      type: object
      required:
      - label
      title: WorkflowOverrideAgentNodeModel
    ASTLessThanOperatorNode-Input:
      properties:
        type:
          type: string
          const: lt_operator
          title: Type
          default: lt_operator
        left:
          $ref: '#/components/schemas/ASTNode-Input'
          description: Left operand of the binary operator.
        right:
          $ref: '#/components/schemas/ASTNode-Input'
          description: Right operand of the binary operator.
      type: object
      required:
      - left
      - right
      title: ASTLessThanOperatorNode
    TestRunMetadata:
      properties:
        workspace_id:
          type: string
          title: Workspace Id
        test_name:
          type: string
          title: Test Name
        ran_by_user_email:
          type: string
          title: Ran By User Email
        test_type:
          type: string
          enum:
          - llm
          - tool_call
          - simulation
          title: Test Type
          default: llm
      type: object
      required:
      - workspace_id
      - test_name
      - ran_by_user_email
      title: TestRunMetadata
    TestRunStatus:
      type: string
      enum:
      - pending
      - passed
      - failed
      title: TestRunStatus
    AlertingSettings:
      properties:
        monitor_configs:
          additionalProperties:
            $ref: '#/components/schemas/AlertingMonitorConfig'
          type: object
          title: Monitor Configs
          description: Alerting configuration keyed by monitor name.
        auto_resolve_after_inactive_minutes:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Auto Resolve After Inactive Minutes
          description: How many minutes an alert can stay inactive before it is auto-resolved. Unset values fall through to the next layer.
        notifiers:
          items:
            oneOf:
            - $ref: '#/components/schemas/AlertingWebhookNotifier'
            - $ref: '#/components/schemas/AlertingIntegrationNotifier'
            discriminator:
              propertyName: type
              mapping:
                integration: '#/components/schemas/AlertingIntegrationNotifier'
                webhook: '#/components/schemas/AlertingWebhookNotifier'
          type: array
          maxItems: 10
          title: Notifiers
          description: Delivery channels for alert lifecycle notifications. Stacked with other layers and deduped by ``webhook_id``, PagerDuty ``connection_id``, or Slack ``(connection_id, channel_id)``.
      type: object
      title: AlertingSettings
      description: 'Alerting configuration used at both per-agent and per-workspace level.

        Cascade order for per-monitor threshold and auto-resolve: agent → workspace →

        system default.'
    CreateResponseUnitTestRequest:
      properties:
        from_conversation_metadata:
          anyOf:
          - $ref: '#/components/schemas/TestFromConversationMetadata-Input'
          - type: 'null'
          description: Metadata of a conversation this test was created from (if applicable).
        dynamic_variables:
          additionalProperties: true
          type: object
          title: Dynamic Variables
          description: Dynamic variables to replace in the agent config during testing
        chat_history:
          items:
            $ref: '#/components/schemas/ConversationHistoryTranscriptCommonModel-Input'
          type: array
          maxItems: 200
          title: Chat History
        conversation_initiation_source:
          anyOf:
          - $ref: '#/components/schemas/ConversationInitiationSource'
          - type: 'null'
          description: Simulate the test as if the conversation originated from this channel.
        environment:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
          description: The environment to resolve environment-specific variable values against when running this test (URL, headers, auth connections). If not provided, defaults to 'production'. For simulation tests, simulation_environment takes precedence when set.
        type:
          type: string
          const: llm
          title: Type
          default: llm
        success_condition:
          type: string
          title: Success Condition
          description: A prompt that evaluates whether the agent's response is successful. Should return True or False.
          default: ''
        success_examples:
          items:
            $ref: '#/components/schemas/AgentSuccessfulResponseExample'
          type: array
          maxItems: 5
          title: Success Examples
          description: Non-empty list of example responses that should be considered successful
        failure_examples:
          items:
            $ref: '#/components/schemas/AgentFailureResponseExample'
          type: array
          maxItems: 5
          title: Failure Examples
          description: Non-empty list of example responses that should be considered failures
        name:
          type: string
          title: Name
        parent_folder_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Folder Id
          description: The ID of the parent folder. If not provided, the test will be created at the root level.
      type: object
      required:
      - name
      title: CreateResponseUnitTestRequest
    ClientEvent:
      type: string
      enum:
      - conversation_initiation_metadata
      - asr_initiation_metadata
      - ping
      - audio
      - interruption
      - user_transcript
      - tentative_user_transcript
      - agent_response
      - agent_response_correction
      - client_tool_call
      - mcp_tool_call
      - mcp_connection_status
      - agent_tool_request
      - agent_tool_response
      - agent_tool_response_full_payload
      - agent_response_metadata
      - vad_score
      - agent_chat_response_part
      - client_error
      - guardrail_triggered
      - dtmf_request
      - agent_response_complete
      - context_usage
      - internal_turn_probability
      - internal_tentative_agent_response
      title: ClientEvent
    TicketCommentResponseModel:
      properties:
        comment:
          type: string
          title: Comment
        created_at_unix_secs:
          type: integer
          title: Created At Unix Secs
        owner_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner User Id
      type: object
      required:
      - comment
      - created_at_unix_secs
      - owner_user_id
      title: TicketCommentResponseModel
    SentimentAnalysisSettings:
      properties: {}
      type: object
      title: SentimentAnalysisSettings
    RagConfig-Input:
      properties:
        enabled:
          type: boolean
          title: Enabled
          default: false
        embedding_model:
          $ref: '#/components/schemas/EmbeddingModelEnum'
          default: e5_mistral_7b_instruct
        max_vector_distance:
          type: number
          exclusiveMaximum: 1.0
          exclusiveMinimum: 0.0
          title: Max Vector Distance
          description: Maximum vector distance of retrieved chunks.
          default: 0.6
          examples:
          - 0.5
        max_documents_length:
          type: integer
          exclusiveMaximum: 10000000.0
          exclusiveMinimum: 0.0
          title: Max Documents Length
          description: Maximum total length of document chunks retrieved from RAG.
          default: 50000
          examples:
          - '50000'
        max_retrieved_rag_chunks_count:
          type: integer
          maximum: 20.0
          exclusiveMinimum: 0.0
          title: Max Retrieved Rag Chunks Count
          description: Maximum number of RAG document chunks to initially retrieve from the vector store. These are then further filtered by vector distance and total length.
          default: 20
          examples:
          - 5
        num_candidates:
          anyOf:
          - type: integer
            maximum: 10000.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Num Candidates
          description: Number of candidates evaluated in ANN vector search. Higher number means better results, but higher latency. Minimum recommended value is 100. If disabled, the default value is used.
          examples:
          - 300
        query_rewrite_prompt_override:
          anyOf:
          - type: string
            maxLength: 1000
            minLength: 1
          - type: 'null'
          title: Query Rewrite Prompt Override
          description: Custom prompt for rewriting user queries before RAG retrieval. The conversation history will be automatically appended at the end. If not set, the default prompt will be used.
          examples:
          - You are given a conversation between a user and an assistant. Rewrite the last question to be self-contained and clear.
        knowledge_base_tool_info:
          anyOf:
          - $ref: '#/components/schemas/KnowledgeBaseToolInfo'
          - type: 'null'
          description: When set, the agent uses the knowledge_base tool instead of the legacy knowledge_base_rag tool. None means the agent is not opted in.
      type: object
      title: RagConfig
    DTMFInputConfig:
      properties:
        dtmf_input_timeout:
          type: number
          maximum: 10.0
          minimum: 0.5
          title: Dtmf Input Timeout
          description: Timeout in seconds to wait for additional DTMF digits
          default: 2.0
        hash_terminator:
          type: boolean
          title: Hash Terminator
          description: 'If true, pressing # immediately completes DTMF input'
          default: true
        redact_input:
          type: boolean
          title: Redact Input
          description: If true, replace the caller's DTMF (keypad) entries with a redaction marker in the transcript, conversation log and analysis. Digits the agent repeats back or passes to a tool are not affected.
          default: false
      type: object
      title: DTMFInputConfig
      description: Configuration for DTMF (keypad) input collection during phone calls.
    EmbedVariant:
      type: string
      enum:
      - tiny
      - compact
      - full
      - expandable
      title: EmbedVariant
      default: full
    BuiltInTools-Input:
      properties:
        transfer_to_agent:
          anyOf:
          - $ref: '#/components/schemas/SystemToolConfig-Input'
          - type: 'null'
          description: The transfer to agent tool
        end_call:
          anyOf:
          - $ref: '#/components/schemas/SystemToolConfig-Input'
          - type: 'null'
          description: The end call tool
        language_detection:
          anyOf:
          - $ref: '#/components/schemas/SystemToolConfig-Input'
          - type: 'null'
          description: The language detection tool
        transfer_to_number:
          anyOf:
          - $ref: '#/components/schemas/SystemToolConfig-Input'
          - type: 'null'
          description: The transfer to number tool
        skip_turn:
          anyOf:
          - $ref: '#/components/schemas/SystemToolConfig-Input'
