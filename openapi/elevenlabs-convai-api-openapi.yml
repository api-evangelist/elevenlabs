          default: false
          deprecated: true
        interruption_mode:
          $ref: '#/components/schemas/ToolInterruptionMode'
          description: Controls whether the user can interrupt the agent around this tool call. 'allow' (default) lets the user interrupt at any time, 'disable_during_tool' suppresses interruptions only while the tool is running, 'disable_during_tool_and_turn' suppresses interruptions while the tool runs and for the agent response that follows it.
