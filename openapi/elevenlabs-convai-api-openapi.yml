        path_params_schema:
          agent_id:
            type: string
        query_params_schema:
          param1:
            type: string
        request_body_schema:
          param1:
            type: string
        request_headers:
          Authorization: Bearer {api_key}
        url: https://example.com/agents/{agent_id}
    SoftTimeoutConfig:
      properties:
        timeout_seconds:
          type: number
          title: Timeout Seconds
          description: Time in seconds before showing the predefined message while waiting for LLM response. Set to -1 to disable.
          default: -1.0
        message:
          type: string
          maxLength: 200
          minLength: 1
          title: Message
          description: Message to show when the first soft timeout is reached while waiting for LLM response. Supports dynamic variables (e.g., {{system__time}}, {{custom_variable}}).
          default: Hhmmmm...yeah.
          x-convai-client-override: true
          x-convai-language-override: true
        additional_soft_timeout_messages:
          items:
            type: string
          type: array
          maxItems: 7
          title: Additional Soft Timeout Messages
          description: Extra static filler messages for subsequent soft timeouts in the same LLM generation. The first timeout uses `message`. If fewer messages are configured than `max_soft_timeouts_per_generation`, the last configured message is repeated; otherwise a built-in filler is used.
          x-convai-client-override: true
          x-convai-language-override: true
        use_llm_generated_message:
          type: boolean
          title: Use Llm Generated Message
          description: If enabled, the soft timeout message will be generated dynamically instead of using the static message.
          default: false
        randomize_fillers:
          type: boolean
          title: Randomize Fillers
          description: If enabled, shuffle the order of static soft timeout messages once at the start of each turn. Only applies when use_llm_generated_message is false.
          default: false
        max_soft_timeouts_per_generation:
          type: integer
          maximum: 8.0
          minimum: 1.0
          title: Max Soft Timeouts Per Generation
          description: Maximum filler messages while waiting for a single LLM response. Fires every timeout_seconds until the LLM streams content or this limit is reached.
          default: 1
        llm_generated_message_prompt_override:
          anyOf:
          - type: string
            maxLength: 1000
            minLength: 1
          - type: 'null'
          title: Llm Generated Message Prompt Override
          description: Custom prompt for generating the soft timeout filler message when use_llm_generated_message is enabled. Recent conversation context is provided as a separate user message. If not set, the default prompt will be used. Supports dynamic variables (e.g., {{system__time}}, {{custom_variable}}).
          examples:
          - Output a SHORT neutral filler phrase (1-4 words MAX) acknowledging you heard the user.
        disable_until_first_user_message:
          type: boolean
          title: Disable Until First User Message
          description: When true, soft timeout fillers are suppressed until the conversation has at least one real user message. Prevents fillers during the agent's opening turn (e.g. workflow generate-immediately / tool calls before the user speaks).
          default: false
      type: object
      title: SoftTimeoutConfig
      description: Configuration for soft timeout functionality during LLM response generation.
      example:
        message: Hhmmmm...yeah.
        timeout_seconds: 2.0
        use_llm_generated_message: false
