    MCPToolConfig-Input:
      properties:
        type:
          type: string
          const: mcp
          title: Type
          default: mcp
        name:
          type: string
          minLength: 0
          pattern: ^[a-zA-Z0-9_-]{1,64}$
          title: Name
        description:
          type: string
          minLength: 0
          title: Description
          description: Description of when the tool should be used and what it does.
        response_timeout_secs:
          type: integer
          maximum: 300.0
          minimum: 5.0
          title: Response Timeout Secs
          description: The maximum time in seconds to wait for the MCP tool call to complete. Must be between 5 and 300 seconds (inclusive).
          default: 30
        disable_interruptions:
          type: boolean
          title: Disable Interruptions
          description: 'DEPRECATED: use `interruption_mode` instead. If true, the user will not be able to interrupt the agent while this tool is running.'
          default: false
          deprecated: true
        interruption_mode:
          $ref: '#/components/schemas/ToolInterruptionMode'
          description: Controls whether the user can interrupt the agent around this tool call. 'allow' (default) lets the user interrupt at any time, 'disable_during_tool' suppresses interruptions only while the tool is running, 'disable_during_tool_and_turn' suppresses interruptions while the tool runs and for the agent response that follows it.
          default: allow
        force_pre_tool_speech:
          type: boolean
          title: Force Pre Tool Speech
          description: 'DEPRECATED: use `pre_tool_speech` instead. If true, the agent will speak before the tool call.'
          default: false
          deprecated: true
        pre_tool_speech:
          $ref: '#/components/schemas/PreToolSpeechMode'
          description: Controls whether the agent speaks before this tool is called. 'auto' (default) decides based on recent tool latency, 'force' always asks the agent to speak, 'off' fully opts out regardless of latency.
          default: auto
        assignments:
          items:
            $ref: '#/components/schemas/DynamicVariableAssignment'
          type: array
          title: Assignments
          description: Configuration for extracting values from tool responses and assigning them to dynamic variables
        tool_call_sound:
          anyOf:
          - $ref: '#/components/schemas/ToolCallSoundType'
          - type: 'null'
          description: Predefined tool call sound type to play during tool execution. If not specified, no tool call sound will be played.
          x-convai-client-override: true
        tool_call_sound_behavior:
          $ref: '#/components/schemas/ToolCallSoundBehavior'
          description: Determines when the tool call sound should play. 'auto' only plays when there's pre-tool speech, 'always' plays for every tool call.
          default: auto
        tool_error_handling_mode:
          $ref: '#/components/schemas/ToolErrorHandlingMode'
          description: Controls how tool errors are processed before being shared with the agent. 'auto' determines handling based on tool type (summarized for native integrations, hide for others), 'summarized' sends an LLM-generated summary, 'passthrough' sends the raw error, 'hide' does not share the error with the agent.
          default: auto
        integration_type:
          $ref: '#/components/schemas/IntegrationType'
          description: The type of MCP tool
        parameters:
          anyOf:
          - $ref: '#/components/schemas/ObjectJsonSchemaProperty-Input'
            description: JSON schema for the parameters the LLM provides.
          - type: 'null'
          description: Schema for any parameters the LLM needs to provide to the MCP tool.
        approval_policy:
          $ref: '#/components/schemas/MCPApprovalPolicy'
          description: The approval policy for the MCP tool
          default: require_approval_all
        mcp_tool_name:
          type: string
          title: Mcp Tool Name
          description: The name of the MCP tool to call
        mcp_tool_description:
          type: string
          title: Mcp Tool Description
          description: The description of the MCP tool to call
        mcp_server_id:
          type: string
          title: Mcp Server Id
          description: The id of the MCP server to call
        mcp_server_name:
          type: string
          title: Mcp Server Name
          description: The name of the MCP server to call
        mcp_input_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Mcp Input Schema
          description: Original inputSchema dict for consistent hashing
        execution_mode:
          $ref: '#/components/schemas/ToolExecutionMode'
          description: 'Determines when and how the tool executes: ''immediate'' executes the tool right away when requested by the LLM, ''post_tool_speech'' waits for the agent to finish speaking before executing, ''async'' runs the tool in the background without blocking - best for long-running operations.'
          default: immediate
        input_overrides:
          anyOf:
          - additionalProperties:
              oneOf:
              - $ref: '#/components/schemas/ConstantSchemaOverride'
              - $ref: '#/components/schemas/DynamicVariableSchemaOverride'
              - $ref: '#/components/schemas/LLMSchemaOverride'
              - $ref: '#/components/schemas/OmitSchemaOverride'
              discriminator:
                propertyName: source
                mapping:
                  constant: '#/components/schemas/ConstantSchemaOverride'
                  dynamic_variable: '#/components/schemas/DynamicVariableSchemaOverride'
                  llm: '#/components/schemas/LLMSchemaOverride'
                  omit: '#/components/schemas/OmitSchemaOverride'
            type: object
          - type: 'null'
          title: Input Overrides
          description: Input parameter overrides for this tool
      type: object
      required:
      - name
      - description
      - integration_type
      - mcp_tool_name
      - mcp_tool_description
      - mcp_server_id
      - mcp_server_name
      title: MCPToolConfig
      description: An MCP tool configuration that can be used to call MCP servers
      x-fern-ignore: true
    LiteralJsonSchemaProperty:
      properties:
        type:
          anyOf:
          - type: string
            enum:
            - boolean
            - string
            - integer
            - number
          - items:
              type: string
            type: array
            maxItems: 2
            minItems: 2
          title: Type
        description:
          type: string
          title: Description
          description: The description of the property. When set, the LLM will provide the value based on this description. Mutually exclusive with dynamic_variable, is_system_provided, constant_value, and is_omitted.
          default: ''
        enum:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Enum
          description: List of allowed string values for string type parameters
        is_system_provided:
          type: boolean
          title: Is System Provided
          description: If true, the value will be populated by the system at runtime. Used by API Integration Webhook tools for templating. Mutually exclusive with description, dynamic_variable, constant_value, and is_omitted.
          default: false
        dynamic_variable:
          type: string
          title: Dynamic Variable
          description: The name of the dynamic variable to use for this property's value. Mutually exclusive with description, is_system_provided, constant_value, and is_omitted.
          default: ''
        allowed_values:
          anyOf:
          - $ref: '#/components/schemas/AllowedValues'
          - type: 'null'
          description: 'Server-side rejection guard for an LLM-provided value: the runtime rejects any value outside the permitted set this object names, and the set is not advertised to the LLM as an enum. Only supported when the value source is `description`; combining it with dynamic_variable, is_system_provided, constant_value, or is_omitted is rejected.'
        allowed_values_dynamic_variable:
          type: string
          title: Allowed Values Dynamic Variable
          description: 'DEPRECATED: use `allowed_values` instead. When set, the LLM provides the value but the runtime rejects any value not present in the list held by this dynamic variable (must be a JSON array such as ["ws_alpha", "ws_beta"]). Use to let the LLM pick from a server-verified set (e.g. the IDs the current user is allowed to access). Requires description; mutually exclusive with dynamic_variable, is_system_provided, constant_value, and is_omitted.'
          default: ''
          deprecated: true
        constant_value:
          anyOf:
          - type: string
          - type: integer
          - type: number
          - type: boolean
          - type: 'null'
          title: Constant Value
          description: A constant value to use for this property. Mutually exclusive with description, dynamic_variable, is_system_provided, and is_omitted.
          default: ''
        is_omitted:
          type: boolean
          title: Is Omitted
          description: If true, this parameter will be completely omitted from the request. Only valid for optional parameters. Mutually exclusive with description, dynamic_variable, is_system_provided, and constant_value.
          default: false
      type: object
      required:
      - type
      title: LiteralJsonSchemaProperty
      description: 'Schema property for literal JSON types. IMPORTANT: Only ONE of the following fields can be set: description (LLM provides value), dynamic_variable (value from variable), is_system_provided (system provides value), constant_value (fixed value), or is_omitted (parameter is omitted). These are mutually exclusive.'
      example:
        description: A user-provided message
        type: string
