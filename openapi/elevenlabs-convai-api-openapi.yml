    TestInvocationSummaryResponseModel:
      properties:
        id:
          type: string
          title: Id
          description: The ID of the test invocation
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Id
          description: The ID of the agent this test invocation belongs to
        branch_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Branch Id
          description: The ID of the branch this test invocation was run on
        version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Version Id
          description: The ID of the agent version this test invocation ran against. For draft or config-override runs this is the version those uncommitted changes were applied on top of. None only for runs recorded before this field existed.
        ran_against_draft:
          type: boolean
          title: Ran Against Draft
          description: Whether the run included uncommitted changes (a saved draft or an ad-hoc config override) layered on top of version_id.
          default: false
        runs_diverged_from_version:
          type: boolean
          title: Runs Diverged From Version
          description: Whether the test runs in this invocation did not all execute against the same version, which happens when a subset of runs was resubmitted after the original run. When true, version_id describes the most recent resubmit rather than every run.
          default: false
        created_at_unix_secs:
          type: integer
          title: Created At Unix Secs
          description: Creation time of the test invocation in unix seconds
        test_run_count:
          type: integer
          title: Test Run Count
          description: Number of test runs in this invocation
        passed_count:
          type: integer
          title: Passed Count
          description: Number of test runs that passed
        failed_count:
          type: integer
          title: Failed Count
          description: Number of test runs that failed
        pending_count:
          type: integer
          title: Pending Count
          description: Number of test runs that are pending
        title:
          type: string
          title: Title
          description: Title of the test invocation - the folder name for folder runs, otherwise the single test name or count of tests
        access_info:
          anyOf:
          - $ref: '#/components/schemas/ResourceAccessInfo'
          - type: 'null'
          description: The access information of the test invocation
        repeat_count:
          type: integer
          title: Repeat Count
          description: Number of times each test was repeated in this invocation
          default: 1
      type: object
      required:
      - id
      - created_at_unix_secs
      - test_run_count
      - passed_count
      - failed_count
      - pending_count
      - title
      title: TestInvocationSummaryResponseModel
