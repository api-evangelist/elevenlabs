  /v1/convai/agents/{agent_id}/triage-tickets:
    get:
      summary: List Agent Conversation Tickets
      description: List an agent's conversation triage tickets, ordered by most recently created first. These are tickets about the agent's own performance on a conversation (for triage with Architect), not tickets an agent opens for end users.
      operationId: list_agent_conversation_tickets_route
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: How many agent conversation tickets to return. Can not exceed 100.
          default: 100
          title: Page Size
        description: How many agent conversation tickets to return. Can not exceed 100.
      - name: conversation_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter tickets by conversation id.
          title: Conversation Id
        description: Filter tickets by conversation id.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AgentConversationTicketStatus'
          - type: 'null'
          description: Filter tickets by status.
          title: Status
        description: Filter tickets by status.
      - name: sources
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/AgentConversationTicketSource'
          - type: 'null'
          description: Filter tickets by how they were raised (qa, agent, manual). Repeat the parameter to filter by multiple sources.
          title: Sources
        description: Filter tickets by how they were raised (qa, agent, manual). Repeat the parameter to filter by multiple sources.
      - name: owner_user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter tickets by creator. Use 'agent' for agent-raised tickets.
          title: Owner User Id
        description: Filter tickets by creator. Use 'agent' for agent-raised tickets.
      - name: assignee_user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter tickets by assignee. Use 'unassigned' for tickets with no assignee.
          title: Assignee User Id
        description: Filter tickets by assignee. Use 'unassigned' for tickets with no assignee.
      - name: issue_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AgentConversationTicketIssueType'
          - type: 'null'
          description: Filter clusters by issue type.
          title: Issue Type
        description: Filter clusters by issue type.
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter tickets by an exact label.
          title: Label
        description: Filter tickets by an exact label.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Used for fetching next page. Cursor is returned in the response.
          title: Cursor
        description: Used for fetching next page. Cursor is returned in the response.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentConversationTicketsPageResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - conversational_ai
      - triage_tickets
      x-fern-sdk-method-name: list
      tags:
      - Convai
    post:
      summary: Create Manual Agent Ticket
      description: Manually raise a follow-up ticket against an agent, not tied to any conversation (for example a task like 'add the KB about X'). The comment is shown as the ticket title. Requires viewer access to the agent.
      operationId: create_manual_agent_ticket_route
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManualTicketRequestModel'
              description: Manual ticket to create.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConversationTicketResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - conversational_ai
      - triage_tickets
      x-fern-sdk-method-name: create_manual
      tags:
      - Convai
  /v1/convai/triage-tickets:
    get:
      summary: List Workspace Conversation Tickets
      description: List conversation triage tickets across every agent in the workspace, ordered by most recently created first. Use this to build a workspace-wide view (for example, tickets assigned to the caller); for a single agent's tickets, use the per-agent endpoint instead. Tickets for agents the caller cannot access are omitted.
      operationId: list_workspace_conversation_tickets_route
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
