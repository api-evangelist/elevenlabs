openapi: 3.2.0
info:
  title: ElevenLabs API Documentation Convai API
  description: This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically, this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.
  version: '1.0'
tags:
- name: Convai
paths:
  /v1/convai/agent-testing/create:
    post:
      summary: Create Agent Response Test
      description: Creates a new agent response test.
      operationId: create_agent_response_test_route
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateResponseUnitTestRequest'
              - $ref: '#/components/schemas/CreateToolCallUnitTestRequest'
              - $ref: '#/components/schemas/CreateSimulationTestRequest'
              description: Create Chat Response Test Request Information
              title: Test Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAgentTestResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - conversational_ai
      - tests
      x-fern-sdk-method-name: create
      tags:
      - Convai
  /v1/convai/agent-testing/{test_id}:
    get:
      summary: Get Agent Response Test By Id
      description: Gets an agent response test by ID.
      operationId: get_agent_response_test_route
      parameters:
      - name: test_id
        in: path
        required: true
        schema:
          type: string
          description: The id of a chat response test. This is returned on test creation.
          examples:
          - TeaqRRdTcIfIu2i7BYfT
          embed: true
          title: Test Id
        description: The id of a chat response test. This is returned on test creation.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/GetResponseUnitTestResponseModel'
                - $ref: '#/components/schemas/GetToolCallUnitTestResponseModel'
                - $ref: '#/components/schemas/GetSimulationTestResponseModel'
                discriminator:
                  propertyName: type
                  mapping:
                    llm: '#/components/schemas/GetResponseUnitTestResponseModel'
                    tool: '#/components/schemas/GetToolCallUnitTestResponseModel'
                    simulation: '#/components/schemas/GetSimulationTestResponseModel'
                title: Response Get Agent Response Test By Id V1 Convai Agent Testing  Test Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - conversational_ai
      - tests
      x-fern-sdk-method-name: get
      tags:
      - Convai
    put:
      summary: Update Agent Response Test
      description: Updates an agent response test by ID.
      operationId: update_agent_response_test_route
      parameters:
      - name: test_id
        in: path
        required: true
        schema:
          type: string
          description: The id of a chat response test. This is returned on test creation.
          examples:
          - TeaqRRdTcIfIu2i7BYfT
          embed: true
          title: Test Id
        description: The id of a chat response test. This is returned on test creation.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/UpdateResponseUnitTestRequest'
              - $ref: '#/components/schemas/UpdateToolCallUnitTestRequest'
              - $ref: '#/components/schemas/UpdateSimulationTestRequest'
              description: Agent test to update
              title: Test Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/GetResponseUnitTestResponseModel'
                - $ref: '#/components/schemas/GetToolCallUnitTestResponseModel'
                - $ref: '#/components/schemas/GetSimulationTestResponseModel'
                discriminator:
                  propertyName: type
                  mapping:
                    llm: '#/components/schemas/GetResponseUnitTestResponseModel'
                    tool: '#/components/schemas/GetToolCallUnitTestResponseModel'
                    simulation: '#/components/schemas/GetSimulationTestResponseModel'
                title: Response Update Agent Response Test V1 Convai Agent Testing  Test Id  Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - conversational_ai
      - tests
      x-fern-sdk-method-name: update
      tags:
      - Convai
    delete:
      summary: Delete Agent Response Test
      description: Deletes an agent response test by ID.
      operationId: delete_chat_response_test_route
      parameters:
      - name: test_id
        in: path
        required: true
        schema:
          type: string
          description: The id of a chat response test. This is returned on test creation.
          examples:
          - TeaqRRdTcIfIu2i7BYfT
          embed: true
          title: Test Id
        description: The id of a chat response test. This is returned on test creation.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - conversational_ai
      - tests
      x-fern-sdk-method-name: delete
      tags:
      - Convai
  /v1/convai/agent-testing/summaries:
    post:
      summary: Get Agent Response Test Summaries By Ids
      description: Gets agent response test summaries for the requested test IDs.
      operationId: get_agent_response_tests_summaries_route
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListTestsByIdsRequestModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTestsSummariesByIdsResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - conversational_ai
      - tests
      x-fern-sdk-method-name: summaries
      tags:
      - Convai
  /v1/convai/agent-testing:
    get:
      summary: List Agent Response Tests
      description: Lists all agent response tests with pagination support and optional search filtering.
      operationId: list_chat_response_tests_route
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Used for fetching next page. Cursor is returned in the response.
          title: Cursor
        description: Used for fetching next page. Cursor is returned in the response.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: How many Tests to return at maximum. Can not exceed 100, defaults to 30.
          default: 30
          title: Page Size
        description: How many Tests to return at maximum. Can not exceed 100, defaults to 30.
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search query to filter tests and folders by name.
          title: Search
        description: Search query to filter tests and folders by name.
      - name: parent_folder_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by parent folder ID. Use 'root' to get items in the root folder.
          title: Parent Folder Id
        description: Filter by parent folder ID. Use 'root' to get items in the root folder.
      - name: types
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/TestType'
          - type: 'null'
          description: If present, the endpoint will return only tests/folders of the given types.
          title: Types
        description: If present, the endpoint will return only tests/folders of the given types.
      - name: include_folders
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Deprecated. Use the `types` query param and include `folder` instead.
          deprecated: true
          title: Include Folders
        description: Deprecated. Use the `types` query param and include `folder` instead.
        deprecated: true
      - name: sort_mode
        in: query
        required: false
        schema:
          enum:
          - default
          - folders_first
          type: string
          description: Sort mode for listing tests. Use 'folders_first' to place folders before tests.
          default: default
          title: Sort Mode
        description: Sort mode for listing tests. Use 'folders_first' to place folders before tests.
      - name: sharing_mode
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TestSharingMode'
          description: Filter test visibility. Use `shared_with_me` to return only tests/folders shared with the current user that they did not create.
          default: all
        description: Filter test visibility. Use `shared_with_me` to return only tests/folders shared with the current user that they did not create.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTestsPageResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - conversational_ai
      - tests
      x-fern-sdk-method-name: list
      tags:
      - Convai
  /v1/convai/test-invocations:
    get:
      summary: List Test Invocations
      description: Lists all test invocations with pagination support and optional search filtering.
      operationId: list_test_invocations_route
      parameters:
      - name: agent_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by agent ID
          title: Agent Id
        description: Filter by agent ID
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: How many Tests to return at maximum. Can not exceed 100, defaults to 30.
          default: 30
          title: Page Size
        description: How many Tests to return at maximum. Can not exceed 100, defaults to 30.
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search query to filter tests and folders by name.
          title: Search
        description: Search query to filter tests and folders by name.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Used for fetching next page. Cursor is returned in the response.
          title: Cursor
        description: Used for fetching next page. Cursor is returned in the response.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTestInvocationsPageResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - conversational_ai
      - tests
      - invocations
      x-fern-sdk-method-name: list
      tags:
      - Convai
  /v1/convai/agents/{agent_id}/run-tests:
    post:
      summary: Run Tests On The Agent
      description: Run selected tests on the agent with provided configuration. If the agent configuration is provided, it will be used to override default agent configuration.
      operationId: run_agent_test_suite_route
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          description: The id of an agent. This is returned on agent creation.
          examples:
          - agent_3701k3ttaq12ewp8b7qv5rfyszkz
          embed: true
          title: Agent Id
        description: The id of an agent. This is returned on agent creation.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunAgentTestsRequestModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTestSuiteInvocationResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - conversational_ai
      - agents
      x-fern-sdk-method-name: run_tests
      tags:
      - Convai
  /v1/convai/test-invocations/{test_invocation_id}:
    get:
      summary: Get Test Invocation
      description: Gets a test invocation by ID.
      operationId: get_test_invocation_route
      parameters:
      - name: test_invocation_id
        in: path
        required: true
        schema:
          type: string
          description: The id of a test invocation. This is returned when tests are run.
          embed: true
          title: Test Invocation Id
        description: The id of a test invocation. This is returned when tests are run.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
