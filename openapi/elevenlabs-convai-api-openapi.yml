    TurnConfigWorkflowOverride:
      properties:
        turn_timeout:
          anyOf:
          - type: number
          - type: 'null'
          title: Turn Timeout
          description: Maximum wait time for the user's reply before re-engaging the user
        initial_wait_time:
          anyOf:
          - type: number
          - type: 'null'
          title: Initial Wait Time
          description: How long the agent will wait for the user to start the conversation if the first message is empty. If not set, uses the regular turn_timeout.
        silence_end_call_timeout:
          anyOf:
          - type: number
          - type: 'null'
          title: Silence End Call Timeout
          description: Maximum wait time since the user last spoke before terminating the call
        mode:
          anyOf:
          - $ref: '#/components/schemas/TurnMode'
          - type: 'null'
          description: The mode of turn detection
          x-fern-ignore: true
        turn_eagerness:
          anyOf:
          - $ref: '#/components/schemas/TurnEagerness'
          - type: 'null'
          description: Controls how eager the agent is to respond. Low = less eager (waits longer), Standard = default eagerness, High = more eager (responds sooner)
        spelling_patience:
          anyOf:
          - $ref: '#/components/schemas/SpellingPatience'
          - type: 'null'
          description: Controls if the agent should be more patient when user is spelling numbers and named entities. Auto = model based, Off = never wait extra
        speculative_turn:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Speculative Turn
          description: When enabled, starts generating LLM responses during silence before full turn confidence is reached, reducing perceived latency. May increase LLM costs.
        retranscribe_on_turn_timeout:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Retranscribe On Turn Timeout
          description: When enabled, if VAD detects no speech, attempts to re-transcribe accumulated audio at turn timeout. Disables silence discount billing for affected turns.
        turn_model:
          anyOf:
          - $ref: '#/components/schemas/TurnModel'
          - type: 'null'
          description: Version of the turn detection model to use.
        interruption_ignore_terms:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Interruption Ignore Terms
          description: List of terms that should not trigger an interruption when spoken by the user (e.g. 'gotcha', 'understood'). Uses case-insensitive exact matching.
        interruption_ignore_term_languages:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Interruption Ignore Term Languages
          description: Language codes for which preset ignore-term categories have been activated. Stored explicitly so display is not inferred from term overlap.
        merge_with_default_ignore_terms:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Merge With Default Ignore Terms
          description: When enabled, the curated default terms for interruption_ignore_term_languages are used in addition to interruption_ignore_terms.
        transcribe_on_disabled_interruptions:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Transcribe On Disabled Interruptions
          description: When interruptions are disabled, still transcribe what the user says so it can carry into the next turn. When off, user speech during a non-interruptible turn is ignored and won't trigger a turn.
        soft_timeout_config:
          anyOf:
          - $ref: '#/components/schemas/SoftTimeoutConfigWorkflowOverride'
          - type: 'null'
          description: Configuration for soft timeout functionality. Provides immediate feedback during longer LLM responses.
      type: object
      title: TurnConfigWorkflowOverride
      example:
        interruption_ignore_term_languages: []
        interruption_ignore_terms: []
        merge_with_default_ignore_terms: false
        mode: turn
        retranscribe_on_turn_timeout: false
        silence_end_call_timeout: -1.0
        soft_timeout_config:
          message: Hhmmmm...yeah.
          timeout_seconds: -1.0
          use_llm_generated_message: false
        speculative_turn: false
        spelling_patience: auto
        transcribe_on_disabled_interruptions: false
        turn_eagerness: normal
        turn_model: turn_v3
        turn_timeout: 7.0
