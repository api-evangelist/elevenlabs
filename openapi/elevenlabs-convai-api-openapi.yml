    SystemToolConfig-Input:
      properties:
        type:
          type: string
          const: system
          title: Type
          description: The type of tool
          default: system
        name:
          type: string
          minLength: 0
          pattern: ^[a-zA-Z0-9_-]{1,64}$
          title: Name
        description:
          type: string
          minLength: 0
          title: Description
          description: Description of when the tool should be used and what it does. Leave empty to use the default description that's optimized for the specific tool type.
          default: ''
        response_timeout_secs:
          type: integer
          title: Response Timeout Secs
          description: The maximum time in seconds to wait for the tool call to complete.
          default: 20
        disable_interruptions:
          type: boolean
          title: Disable Interruptions
          description: 'DEPRECATED: use `interruption_mode` instead. If true, the user will not be able to interrupt the agent while this tool is running.'
          default: false
          deprecated: true
        interruption_mode:
          $ref: '#/components/schemas/ToolInterruptionMode'
          description: Controls whether the user can interrupt the agent around this tool call. 'allow' (default) lets the user interrupt at any time, 'disable_during_tool' suppresses interruptions only while the tool is running, 'disable_during_tool_and_turn' suppresses interruptions while the tool runs and for the agent response that follows it.
          default: allow
        force_pre_tool_speech:
          type: boolean
          title: Force Pre Tool Speech
          description: 'DEPRECATED: use `pre_tool_speech` instead. If true, the agent will speak before the tool call.'
          default: false
          deprecated: true
        pre_tool_speech:
          $ref: '#/components/schemas/PreToolSpeechMode'
          description: Controls whether the agent speaks before this tool is called. 'auto' (default) decides based on recent tool latency, 'force' always asks the agent to speak, 'off' fully opts out regardless of latency.
          default: auto
        assignments:
          items:
            $ref: '#/components/schemas/DynamicVariableAssignment'
          type: array
          title: Assignments
          description: Configuration for extracting values from tool responses and assigning them to dynamic variables
        tool_call_sound:
          anyOf:
          - $ref: '#/components/schemas/ToolCallSoundType'
          - type: 'null'
          description: Predefined tool call sound type to play during tool execution. If not specified, no tool call sound will be played.
          x-convai-client-override: true
        tool_call_sound_behavior:
          $ref: '#/components/schemas/ToolCallSoundBehavior'
          description: Determines when the tool call sound should play. 'auto' only plays when there's pre-tool speech, 'always' plays for every tool call.
          default: auto
        tool_error_handling_mode:
          $ref: '#/components/schemas/ToolErrorHandlingMode'
          description: Controls how tool errors are processed before being shared with the agent. 'auto' determines handling based on tool type (summarized for native integrations, hide for others), 'summarized' sends an LLM-generated summary, 'passthrough' sends the raw error, 'hide' does not share the error with the agent.
          default: auto
        params:
          oneOf:
          - $ref: '#/components/schemas/EndCallToolConfig'
          - $ref: '#/components/schemas/LanguageDetectionToolConfig'
          - $ref: '#/components/schemas/TransferToAgentToolConfig-Input'
          - $ref: '#/components/schemas/TransferToNumberToolConfig-Input'
          - $ref: '#/components/schemas/SkipTurnToolConfig'
          - $ref: '#/components/schemas/PlayDTMFToolConfig'
          - $ref: '#/components/schemas/VoicemailDetectionToolConfig'
          - $ref: '#/components/schemas/KnowledgeBaseRagToolConfig'
          - $ref: '#/components/schemas/KnowledgeBaseToolConfig'
          - $ref: '#/components/schemas/StartProcedureToolConfig'
          - $ref: '#/components/schemas/EndProcedureToolConfig'
          title: Params
          discriminator:
            propertyName: system_tool_type
            mapping:
              end_call: '#/components/schemas/EndCallToolConfig'
              end_procedure: '#/components/schemas/EndProcedureToolConfig'
              knowledge_base: '#/components/schemas/KnowledgeBaseToolConfig'
              knowledge_base_rag: '#/components/schemas/KnowledgeBaseRagToolConfig'
              language_detection: '#/components/schemas/LanguageDetectionToolConfig'
              play_keypad_touch_tone: '#/components/schemas/PlayDTMFToolConfig'
              skip_turn: '#/components/schemas/SkipTurnToolConfig'
              start_procedure: '#/components/schemas/StartProcedureToolConfig'
              transfer_to_agent: '#/components/schemas/TransferToAgentToolConfig-Input'
              transfer_to_number: '#/components/schemas/TransferToNumberToolConfig-Input'
              voicemail_detection: '#/components/schemas/VoicemailDetectionToolConfig'
      type: object
      required:
      - name
      - params
      title: SystemToolConfig
      description: A system tool is a tool that is used to call a system method in the server
      examples:
      - description: ''
        name: end_call
        params:
          system_tool_type: end_call
        type: system
      - description: Custom description for specific use case
        name: transfer_to_agent
        params:
          system_tool_type: transfer_to_agent
          transfers: []
        type: system
