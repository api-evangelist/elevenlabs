          description: Dynamic variables to replace in the agent config during testing
        chat_history:
          items:
            $ref: '#/components/schemas/ConversationHistoryTranscriptCommonModel-Output'
          type: array
          maxItems: 200
          title: Chat History
        conversation_initiation_source:
          anyOf:
          - $ref: '#/components/schemas/ConversationInitiationSource'
          - type: 'null'
          description: Simulate the test as if the conversation originated from this channel.
        environment:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
          description: The environment to resolve environment-specific variable values against when running this test (URL, headers, auth connections). If not provided, defaults to 'production'. For simulation tests, simulation_environment takes precedence when set.
        type:
          type: string
          const: tool
          title: Type
          default: tool
        tool_call_parameters:
          anyOf:
          - $ref: '#/components/schemas/UnitTestToolCallEvaluationModel-Output'
          - type: 'null'
          description: How to evaluate the agent's tool call (if any). If empty, the tool call is not evaluated.
        check_any_tool_matches:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Check Any Tool Matches
          description: If set to True this test will pass if any tool call returned by the LLM matches the criteria. Otherwise it will fail if more than one tool is returned by the agent.
