        voice_settings:
          items:
            type: string
          type: array
          title: Voice Settings
          description: "    Optional voice settings overrides for the project, encoded as a list of JSON strings.\n\n    Example:\n    [\"{\\\"voice_id\\\": \\\"21m00Tcm4TlvDq8ikWAM\\\", \\\"stability\\\": 0.7, \\\"similarity_boost\\\": 0.8, \\\"style\\\": 0.5, \\\"speed\\\": 1.0, \\\"use_speaker_boost\\\": true}\"]\n    "
          examples:
