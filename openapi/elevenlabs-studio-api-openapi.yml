          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePronunciationDictionaryResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
