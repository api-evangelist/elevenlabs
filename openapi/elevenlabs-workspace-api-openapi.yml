components:
  schemas:
    CustomHeaderAuthResponse:
      properties:
        name:
          type: string
          title: Name
        auth_type:
          type: string
          const: custom_header_auth
          title: Auth Type
          default: custom_header_auth
        provider:
          type: string
          title: Provider
        header_name:
          type: string
          title: Header Name
          description: The name of the header to use for authentication (e.g., 'x-api-key')
        id:
          type: string
          title: Id
        used_by:
          anyOf:
          - $ref: '#/components/schemas/AuthConnectionDependencies'
          - type: 'null'
        status:
          $ref: '#/components/schemas/AuthConnectionStatus'
          default: active
        status_detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Detail
        status_updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Updated At
      type: object
      required:
      - name
      - provider
      - header_name
      - id
      title: CustomHeaderAuthResponse
      description: Response model for Custom Header Auth auth connections
    UrlSecretAuthResponse:
      properties:
        name:
          type: string
          title: Name
        auth_type:
          type: string
          const: url_secret
          title: Auth Type
          default: url_secret
        provider:
          type: string
          title: Provider
        id:
          type: string
          title: Id
        used_by:
          anyOf:
          - $ref: '#/components/schemas/AuthConnectionDependencies'
          - type: 'null'
        status:
          $ref: '#/components/schemas/AuthConnectionStatus'
          default: active
        status_detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Detail
        status_updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Updated At
      type: object
      required:
      - name
      - provider
      - id
      title: UrlSecretAuthResponse
    PatchWorkspaceWebhookResponseModel:
      properties:
        status:
          type: string
          title: Status
          description: The status of the workspace webhook patch request. If the request was successful, the status will be 'ok'. Otherwise an error message with status 500 will be returned.
      type: object
      required:
      - status
      title: PatchWorkspaceWebhookResponseModel
      example:
        status: ok
    WorkspaceMemberResponseModel:
      properties:
        user_id:
          type: string
          title: User Id
          description: The user ID of the workspace member.
        email:
          type: string
          title: Email
          description: The email address of the workspace member.
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
          description: The first name of the workspace member, if available.
        seat_type:
          anyOf:
          - $ref: '#/components/schemas/SeatType'
          - type: 'null'
          description: The seat type (role) of the workspace member.
        is_owner:
          type: boolean
          title: Is Owner
          description: Whether the member is the workspace owner.
        is_locked:
          type: boolean
          title: Is Locked
          description: Whether the member's account is locked in this workspace.
      type: object
      required:
      - user_id
      - email
      - first_name
      - seat_type
      - is_owner
