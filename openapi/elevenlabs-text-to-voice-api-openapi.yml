openapi: 3.2.0
info:
  title: ElevenLabs API Documentation Text To Voice API
  description: This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically, this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.
  version: '1.0'
tags:
- name: text-to-voice
  description: Design and generate custom voices from a text prompt.
paths:
  /v1/text-to-voice/create-previews:
    post:
      tags:
      - text-to-voice
      summary: '[Deprecated] Generate A Voice Preview From Description'
      description: '**Deprecated.** Use `POST /v1/text-to-voice/design` instead. Generate a custom voice based on voice description. This method returns a list of voice previews. Each preview has a generated_voice_id and a sample of the voice as base64 encoded mp3 audio. To create the voice use `POST /v1/text-to-voice` with the chosen `generated_voice_id`.'
      operationId: text_to_voice
      deprecated: true
      parameters:
      - name: output_format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AllowedOutputFormats'
          title: Output format of the generated audio.
          description: Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.
          enum:
          - mp3_22050_32
          - mp3_24000_48
          - mp3_44100_32
          - mp3_44100_64
          - mp3_44100_96
          - mp3_44100_128
          - mp3_44100_192
          - pcm_8000
          - pcm_16000
          - pcm_22050
          - pcm_24000
          - pcm_32000
          - pcm_44100
          - pcm_48000
          - ulaw_8000
          - alaw_8000
          - opus_48000_32
          - opus_48000_64
          - opus_48000_96
          - opus_48000_128
          - opus_48000_192
          default: mp3_44100_192
        description: Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoicePreviewsRequestModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoicePreviewsResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: text_to_voice
      x-fern-sdk-method-name: create_previews
  /v1/text-to-voice:
    post:
      tags:
      - text-to-voice
      summary: Create A New Voice From Voice Preview
      description: Create a voice from previously generated voice preview. This endpoint should be called after you fetched a generated_voice_id using POST /v1/text-to-voice/design or POST /v1/text-to-voice/:voice_id/remix.
      operationId: create_voice
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Create_a_new_voice_from_voice_preview_v1_text_to_voice_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: text_to_voice
      x-fern-sdk-method-name: create
  /v1/text-to-voice/design:
    post:
      tags:
      - text-to-voice
      summary: Design A Voice
      description: Design a voice via a prompt. This method returns a list of voice previews. Each preview has a generated_voice_id and a sample of the voice as base64 encoded mp3 audio. To create a voice use the generated_voice_id of the preferred preview with the /v1/text-to-voice endpoint.
      operationId: text_to_voice_design
      parameters:
      - name: output_format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AllowedOutputFormats'
          title: Output format of the generated audio.
          description: Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.
          enum:
          - mp3_22050_32
          - mp3_24000_48
          - mp3_44100_32
          - mp3_44100_64
          - mp3_44100_96
          - mp3_44100_128
          - mp3_44100_192
          - pcm_8000
          - pcm_16000
          - pcm_22050
          - pcm_24000
          - pcm_32000
          - pcm_44100
          - pcm_48000
          - ulaw_8000
          - alaw_8000
          - opus_48000_32
          - opus_48000_64
          - opus_48000_96
          - opus_48000_128
          - opus_48000_192
          default: mp3_44100_192
        description: Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceDesignRequestModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoicePreviewsResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: text_to_voice
      x-fern-sdk-method-name: design
  /v1/text-to-voice/{voice_id}/remix:
    post:
      tags:
      - text-to-voice
      summary: Remix A Voice
      description: Remix an existing voice via a prompt. This method returns a list of voice previews. Each preview has a generated_voice_id and a sample of the voice as base64 encoded mp3 audio. To create a voice use the generated_voice_id of the preferred preview with the /v1/text-to-voice endpoint.
      operationId: text_to_voice_remix
      parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
          examples:
          - 21m00Tcm4TlvDq8ikWAM
          title: Voice Id
        description: Voice ID to be used, you can use https://api.elevenlabs.io/v1/voices to list all the available voices.
      - name: output_format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AllowedOutputFormats'
          title: Output format of the generated audio.
          description: Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.
          enum:
          - mp3_22050_32
          - mp3_24000_48
          - mp3_44100_32
          - mp3_44100_64
          - mp3_44100_96
          - mp3_44100_128
          - mp3_44100_192
          - pcm_8000
          - pcm_16000
          - pcm_22050
          - pcm_24000
          - pcm_32000
          - pcm_44100
          - pcm_48000
          - ulaw_8000
          - alaw_8000
          - opus_48000_32
          - opus_48000_64
          - opus_48000_96
          - opus_48000_128
          - opus_48000_192
          default: mp3_44100_192
        description: Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceRemixRequestModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoicePreviewsResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: text_to_voice
      x-fern-sdk-method-name: remix
  /v1/text-to-voice/{generated_voice_id}/stream:
    get:
      tags:
      - text-to-voice
      summary: Text To Voice Preview Streaming
      description: Stream a voice preview that was created via the /v1/text-to-voice/design endpoint.
      operationId: text_to_voice_preview_stream
      parameters:
      - name: generated_voice_id
        in: path
        required: true
        schema:
          type: string
          description: The generated_voice_id to stream.
          examples:
          - 37HceQefKmEi3bGovXjL
          embed: true
          title: Generated Voice Id
        description: The generated_voice_id to stream.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Streaming audio data
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - text_to_voice
      - preview
      x-fern-sdk-method-name: stream
      x-fern-streaming: true
components:
  schemas:
    Body_Create_a_new_voice_from_voice_preview_v1_text_to_voice_post:
      properties:
        voice_name:
          type: string
          title: Voice Name
          description: Name to use for the created voice.
          examples:
          - Sassy squeaky mouse
        voice_description:
          type: string
          maxLength: 1000
          minLength: 20
          title: Voice Description
          description: Description to use for the created voice.
          examples:
          - A sassy squeaky mouse
        generated_voice_id:
          type: string
          title: Generated Voice Id
          description: The generated_voice_id to create; obtain it from POST /v1/text-to-voice/design, POST /v1/text-to-voice/:voice_id/remix, or the response headers when generating previews.
          examples:
          - 37HceQefKmEi3bGovXjL
        labels:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Labels
          description: Optional, metadata to add to the created voice. Defaults to None.
          examples:
          - language: en
          name: Voice metadata
        played_not_selected_voice_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Played Not Selected Voice Ids
          description: List of voice ids that the user has played but not selected. Used for RLHF.
      type: object
      required:
      - voice_name
      - voice_description
      - generated_voice_id
      title: Body_Create_a_new_voice_from_voice_preview_v1_text_to_voice_post
    UtteranceResponseModel:
      properties:
        start:
          type: number
          title: Start
          description: The start time of the utterance in seconds.
        end:
          type: number
          title: End
          description: The end time of the utterance in seconds.
      type: object
      required:
      - start
      - end
      title: UtteranceResponseModel
      example:
        end: 1.0
        start: 0.0
    VoiceDesignRequestModel:
      properties:
        voice_description:
          type: string
          maxLength: 1000
          minLength: 20
          title: Voice Description
          description: Description to use for the created voice.
          examples:
          - A sassy squeaky mouse
        model_id:
          type: string
          enum:
          - eleven_multilingual_ttv_v2
          - eleven_ttv_v3
          title: Model Id
          description: 'Model to use for the voice generation. Possible values: eleven_multilingual_ttv_v2, eleven_ttv_v3.'
          default: eleven_multilingual_ttv_v2
          examples:
          - eleven_multilingual_ttv_v2
        text:
          anyOf:
          - type: string
            maxLength: 1000
            minLength: 100
          - type: 'null'
          title: Text
          description: Text to generate, text length has to be between 100 and 1000.
          examples:
          - Every act of kindness, no matter how small, carries value and can make a difference, as no gesture of goodwill is ever wasted.
        auto_generate_text:
          type: boolean
          title: Auto Generate Text
          description: Whether to automatically generate a text suitable for the voice description.
          default: false
        loudness:
          type: number
          maximum: 1.0
          minimum: -1.0
          title: Loudness
          description: Controls the volume level of the generated voice. -1 is quietest, 1 is loudest, 0 corresponds to roughly -24 LUFS.
          default: 0.5
          examples:
          - 0.5
        seed:
          anyOf:
          - type: integer
            maximum: 2147483647.0
            minimum: 0.0
          - type: 'null'
          title: Seed
          description: Random number that controls the voice generation. Same seed with same inputs produces same voice.
          examples:
          - 11
        guidance_scale:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Guidance Scale
          description: Controls how closely the AI follows the prompt. Lower numbers give the AI more freedom to be creative, while higher numbers force it to stick more to the prompt. High numbers can cause voice to sound artificial or robotic. We recommend to use longer, more detailed prompts at lower Guidance Scale.
          default: 5
          examples:
          - 5
        stream_previews:
          type: boolean
          title: Stream Previews
          description: Determines whether the Text to Voice previews should be included in the response. If true, only the generated IDs will be returned which can then be streamed via the /v1/text-to-voice/:generated_voice_id/stream endpoint.
          default: false
          examples:
          - true
        should_enhance:
          type: boolean
          title: Should Enhance
          description: Whether to enhance the voice description using AI to add more detail and improve voice generation quality. When enabled, the system will automatically expand simple prompts into more detailed voice descriptions. Defaults to False
          default: false
          examples:
          - true
        remixing_session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Remixing Session Id
          description: The remixing session id.
          examples:
          - '123'
        remixing_session_iteration_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Remixing Session Iteration Id
          description: The id of the remixing session iteration where these generations should be attached to. If not provided, a new iteration will be created.
          examples:
          - '123'
        quality:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: -1.0
          - type: 'null'
          title: Quality
          description: Higher quality results in better voice output but less variety.
          examples:
          - 0.9
        reference_audio_base64:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference Audio Base64
          description: Reference audio to use for the voice generation. The audio should be base64 encoded. Only supported when using the  eleven_ttv_v3 model.
        prompt_strength:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Prompt Strength
          description: Controls the balance of prompt versus reference audio when generating voice samples. 0 means almost no prompt influence, 1 means almost no reference audio influence. Only supported when using the eleven_ttv_v3 model.
          examples:
          - 0.25
      type: object
      required:
      - voice_description
      title: VoiceDesignRequestModel
    VoicePreviewsResponseModel:
      properties:
        previews:
          items:
            $ref: '#/components/schemas/VoicePreviewResponseModel'
          type: array
          title: Previews
          description: The previews of the generated voices.
        text:
          type: string
          title: Text
          description: The text used to preview the voices.
      type: object
      required:
      - previews
      - text
      title: VoicePreviewsResponseModel
    VoiceResponseModel:
      properties:
        voice_id:
          type: string
          title: Voice Id
          description: The ID of the voice.
        name:
          type: string
          title: Name
          description: The name of the voice.
        samples:
          anyOf:
          - items:
              $ref: '#/components/schemas/SampleResponseModel'
            type: array
          - type: 'null'
          title: Samples
          description: List of samples associated with the voice.
        category:
          type: string
          enum:
          - generated
          - cloned
          - premade
          - professional
          - famous
          - high_quality
          title: Category
          description: The category of the voice.
        fine_tuning:
          anyOf:
          - $ref: '#/components/schemas/FineTuningResponseModel'
          - type: 'null'
          description: Fine-tuning information for the voice.
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
          description: Labels associated with the voice.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: The description of the voice.
        preview_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Preview Url
          description: The preview URL of the voice.
        available_for_tiers:
          items:
            type: string
          type: array
          title: Available For Tiers
          description: The tiers the voice is available for.
        settings:
          anyOf:
          - $ref: '#/components/schemas/VoiceSettingsResponseModel'
          - type: 'null'
          description: The settings of the voice.
        sharing:
          anyOf:
          - $ref: '#/components/schemas/VoiceSharingResponseModel'
          - type: 'null'
          description: The sharing information of the voice.
        high_quality_base_model_ids:
          items:
            type: string
          type: array
          title: High Quality Base Model Ids
          description: The base model IDs for high-quality voices.
        verified_languages:
          anyOf:
          - items:
              $ref: '#/components/schemas/VerifiedVoiceLanguageResponseModel'
            type: array
          - type: 'null'
          title: Verified Languages
          description: The verified languages of the voice.
        collection_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Collection Ids
          description: The IDs of collections this voice belongs to.
        safety_control:
          anyOf:
          - type: string
            enum:
            - NONE
            - BAN
            - CAPTCHA
            - ENTERPRISE_BAN
            - ENTERPRISE_CAPTCHA
          - type: 'null'
          title: Safety Control
          description: The safety controls of the voice.
        voice_verification:
          anyOf:
          - $ref: '#/components/schemas/VoiceVerificationResponseModel'
          - type: 'null'
          description: The voice verification of the voice.
        permission_on_resource:
          anyOf:
          - type: string
          - type: 'null'
          title: Permission On Resource
          description: The permission on the resource of the voice.
        is_owner:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Owner
          description: Whether the voice is owned by the user.
        is_legacy:
          type: boolean
          title: Is Legacy
          description: Whether the voice is legacy.
          default: false
        is_mixed:
          type: boolean
          title: Is Mixed
          description: Whether the voice is mixed.
          default: false
        favorited_at_unix:
          anyOf:
          - type: integer
          - type: 'null'
          title: Favorited At Unix
          description: Timestamp when the voice was marked as favorite in Unix time.
        created_at_unix:
          anyOf:
          - type: integer
          - type: 'null'
          title: Created At Unix
          description: The creation time of the voice in Unix time.
        is_bookmarked:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Bookmarked
          description: Whether the voice is bookmarked by the current user. Only relevant for community (library-copied) voices.
        recording_quality:
          anyOf:
          - type: string
            enum:
            - studio
            - good
            - ok
            - poor
            - bad
          - type: 'null'
          title: Recording Quality
          description: The recording quality of the voice as determined by the review pipeline.
        labelling_status:
          anyOf:
          - type: string
            enum:
            - in_review
            - review_complete
          - type: 'null'
          title: Labelling Status
          description: The review pipeline status of the voice.
        recording_quality_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Recording Quality Reason
          description: The reason for the recording quality assessment, as determined by the review pipeline.
      type: object
      required:
      - voice_id
      - name
      - category
      - labels
      - available_for_tiers
      - high_quality_base_model_ids
      title: VoiceResponseModel
      example:
        available_for_tiers:
        - creator
        - enterprise
        category: professional
        description: A warm, expressive voice with a touch of humor.
        fine_tuning:
          is_allowed_to_fine_tune: true
          manual_verification_requested: false
          state:
            eleven_multilingual_v2: fine_tuned
          verification_attempts_count: 2
          verification_failures: []
        high_quality_base_model_ids:
        - eleven_v2_flash
        - eleven_flash_v2
        - eleven_turbo_v2_5
        - eleven_multilingual_v2
        - eleven_v2_5_flash
        - eleven_flash_v2_5
        - eleven_turbo_v2
        is_legacy: false
        is_mixed: false
        is_owner: false
        labels:
          accent: American
          age: middle-aged
          description: expressive
          gender: female
          use_case: social media
        name: Rachel
        preview_url: https://storage.googleapis.com/eleven-public-prod/premade/voices/9BWtsMINqrJLrRacOk9x/405766b8-1f4e-4d3c-aba1-6f25333823ec.mp3
