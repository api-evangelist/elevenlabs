openapi: 3.2.0
info:
  title: Elevenlabs Dubbing API
  version: '1.0'
  description: 'Operations tagged Dubbing across 2 of this provider''s published API definitions: elevenlabs-dubbing-openapi.yml, elevenlabs-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.elevenlabs.io
  description: Production Server
tags:
- name: Dubbing
  description: Endpoints for creating, managing, and retrieving dubbed audio and video content across languages.
paths:
  /v1/dubbing:
    post:
      operationId: createDubbing
      summary: Dub a video or audio file
      description: Creates a new dubbing project from an uploaded audio or video file or a source URL. The dubbing process transcribes, translates, and re-synthesizes the audio content in the target language while preserving the original speakers' voice characteristics.
      tags:
      - Dubbing
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateDubbingRequest'
      responses:
        '200':
          description: Dubbing project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingResponse'
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid or missing API key
        '422':
          description: Unprocessable entity - unsupported file format
      security:
      - apiKeyAuth: []
    get:
      tags:
      - Dubbing
      summary: List Dubs
      description: List the dubs you have access to.
      operationId: list_dubs
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Used for fetching next page. Cursor is returned in the response.
          title: Cursor
        description: Used for fetching next page. Cursor is returned in the response.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: How many dubs to return at maximum. Can not exceed 200, defaults to 100.
          default: 100
          title: Page Size
        description: How many dubs to return at maximum. Can not exceed 200, defaults to 100.
      - name: dubbing_status
        in: query
        required: false
        schema:
          enum:
          - dubbing
          - dubbed
          - failed
          type: string
          description: What state the dub is currently in.
          embed: true
          title: Dubbing Status
        description: What state the dub is currently in.
      - name: dubbing_statuses
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              enum:
              - queued
              - preparing
              - dubbing
              - dubbed
              - failed
              type: string
          - type: 'null'
          description: Filter by dubbing status.
          title: Dubbing Statuses
        description: Filter by dubbing status.
      - name: dubbing_models
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              enum:
              - dubbing_v1
              - dubbing_v2
              type: string
          - type: 'null'
          description: Filter by dubbing model generation.
          title: Dubbing Models
        description: Filter by dubbing model generation.
      - name: target_language_codes
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by target language code.
          title: Target Language Codes
        description: Filter by target language code.
      - name: creation_sources
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              enum:
              - flow_node
              - dubbing_ui
              - dubbing_api
              type: string
          - type: 'null'
          description: Filter by dubbing creation source.
          title: Creation Sources
        description: Filter by dubbing creation source.
      - name: filter_by_creator
        in: query
        required: false
        schema:
          enum:
          - personal
          - others
          - all
          type: string
          description: Filters who created the resources being listed, whether it was the user running the request or someone else that shared the resource with them.
          examples:
          - all
          default: all
          title: Filter By Creator
        description: Filters who created the resources being listed, whether it was the user running the request or someone else that shared the resource with them.
      - name: order_by
        in: query
        required: false
        schema:
          enum:
          - created_at
          - name
          type: string
          description: The field to use for ordering results from this query.
          default: created_at
          title: Order By
        description: The field to use for ordering results from this query.
      - name: order_direction
        in: query
        required: false
        schema:
          enum:
          - DESCENDING
          - ASCENDING
          type: string
          description: The order direction to use for results from this query.
          default: DESCENDING
          title: Order Direction
        description: The order direction to use for results from this query.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingMetadataPageResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: dubbing
      x-fern-sdk-method-name: list
      security:
      - apiKeyAuth: []
    servers:
    - url: https://api.elevenlabs.io
      description: Production Server
  /v1/dubbing/{dubbing_id}:
    get:
      operationId: getDubbing
      summary: Get dubbing metadata
      description: Returns metadata and status information about a dubbing project, including the current processing state and available languages.
      tags:
      - Dubbing
      parameters:
      - $ref: '#/components/parameters/dubbingId'
      responses:
        '200':
          description: Dubbing metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingMetadata'
        '401':
          description: Unauthorized - invalid or missing API key
        '404':
          description: Dubbing project not found
      security:
      - apiKeyAuth: []
    delete:
      operationId: deleteDubbing
      summary: Delete dubbing
      description: Deletes a dubbing project and all associated resources. This action is irreversible.
      tags:
      - Dubbing
      parameters:
      - $ref: '#/components/parameters/dubbingId'
      responses:
        '200':
          description: Dubbing project deleted successfully
        '401':
          description: Unauthorized - invalid or missing API key
        '404':
          description: Dubbing project not found
      security:
      - apiKeyAuth: []
    servers:
    - url: https://api.elevenlabs.io
      description: Production Server
  /v1/dubbing/project:
    post:
      tags:
      - Dubbing
      summary: Create Dubbing Project
      description: 'Create a dubbing project from an uploaded file (`file`) or a source URL (`source_url`).


        Returns as soon as the project record exists, before the source has been fetched: the project starts `queued` and reaches `ready` once its source has been transcribed. Add a language target to it for each language you want, or pass `target_language` to queue the first one here.


        Creating a project incurs a minimum charge of one language: you are charged for at least one language''s dubbing when the project is created, before any output exists. This charge prepays the first language target — the first target you add, or the one queued via `target_language`, consumes it — and each additional language is charged separately.


        Preparation can take minutes on a long source, so we recommend passing `webhook_ids` to be notified when the project turns `ready` or `failed`, rather than polling for it.'
      operationId: dubbing_project_create
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Create_Dubbing_Project_v1_dubbing_project_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - dubbing
      - project
      x-fern-sdk-method-name: create
      x-fern-examples:
      - request:
          source_url: https://example.com/promo.mp4
          source_language: en
          reference: Q3 marketing video
        response:
          body:
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
            status: queued
            reference: Q3 marketing video
            source_language: en
            model_id: dubbing_v2
            language_ids: []
            webhook_ids: []
            revision: 0
            warnings: []
            created_at: '2026-07-03T10:15:30Z'
            updated_at: '2026-07-03T10:15:30Z'
    get:
      tags:
      - Dubbing
      summary: List Dubbing Projects
      description: List the dubbing projects in your workspace that you can access, newest first, cursor-paginated. Listed projects carry no `language_ids`; fetch a project, or list its language targets, to see them.
      operationId: dubbing_project_list
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Pass the `next_cursor` from a previous response to fetch the page after it. Omit for the first page.
          title: Cursor
        description: Pass the `next_cursor` from a previous response to fetch the page after it. Omit for the first page.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Number of projects per page. Clamped to between 1 and 100 rather than rejected, so a larger value returns a full page.
          default: 20
          title: Page Size
        description: Number of projects per page. Clamped to between 1 and 100 rather than rejected, so a larger value returns a full page.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter to projects in this status: `queued`, `preparing`, `ready`, or `failed`. Omit to return every status.'
          title: Status
        description: 'Filter to projects in this status: `queued`, `preparing`, `ready`, or `failed`. Omit to return every status.'
      - name: sort_direction
        in: query
        required: false
        schema:
          enum:
          - ASCENDING
          - DESCENDING
          type: string
          description: Sort by creation time; newest first by default.
          default: DESCENDING
          title: Sort Direction
        description: Sort by creation time; newest first by default.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingProjectListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - dubbing
      - project
      x-fern-sdk-method-name: list
      x-fern-examples:
      - query-parameters:
          page_size: 20
        response:
          body:
            projects:
            - project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
              status: ready
              reference: Q3 marketing video
              source_language: en
              model_id: dubbing_v2
              media:
                filename: promo.mp4
                duration_s: 42.5
                has_video: true
                mime_type: video/mp4
              language_ids:
              - lang_1001kwkyxp0je6ktn4knsfrasx5s
              webhook_ids: []
              revision: 3
              warnings:
              - type: voices_not_permitted
                speaker_ids:
                - speaker_1
                message: Voice cloning was not permitted for speaker speaker_1, so a replacement voice was used.
              created_at: '2026-07-03T10:15:30Z'
              updated_at: '2026-07-03T10:17:12Z'
  /v1/dubbing/project/{project_id}:
    get:
      tags:
      - Dubbing
      summary: Get Dubbing Project
      description: Full project detail, including the IDs of every language target under it. To follow a project to `ready`, we recommend a `webhook_ids` subscription rather than polling this endpoint.
      operationId: dubbing_project_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the dubbing project to fetch.
          title: Project Id
        description: Identifier of the dubbing project to fetch.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - dubbing
      - project
      x-fern-sdk-method-name: get
      x-fern-examples:
      - path-parameters:
          project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
        response:
          body:
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
            status: ready
            reference: Q3 marketing video
            source_language: en
            model_id: dubbing_v2
            media:
              filename: promo.mp4
              duration_s: 42.5
              has_video: true
              mime_type: video/mp4
            language_ids:
            - lang_1001kwkyxp0je6ktn4knsfrasx5s
            webhook_ids: []
            revision: 3
            warnings:
            - type: voices_not_permitted
              speaker_ids:
              - speaker_1
              message: Voice cloning was not permitted for speaker speaker_1, so a replacement voice was used.
            created_at: '2026-07-03T10:15:30Z'
            updated_at: '2026-07-03T10:17:12Z'
    delete:
      tags:
      - Dubbing
      summary: Delete Dubbing Project
      description: Delete a project, every language target under it, and their stored media and outputs. This cannot be undone, and a dub already running is still billed.
      operationId: dubbing_project_delete
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the dubbing project to delete.
          title: Project Id
        description: Identifier of the dubbing project to delete.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - dubbing
      - project
      x-fern-sdk-method-name: delete
      x-fern-examples:
      - path-parameters:
          project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
  /v1/dubbing/project/{project_id}/language:
    post:
      tags:
      - Dubbing
      summary: Create Dubbing Language Target
      description: 'Add a language to dub a project into, and queue the dub.


        This is the call that produces dubbed audio, and it is billed per generation. The target is created `queued` and starts as soon as the project is `ready`, so it can be added at any point after the project is created. It inherits the project''s dubbing model and cannot pick another.


        A project created with `webhook_ids` sends a `dubbing_language_completed` event carrying the output download URLs, so we recommend subscribing rather than polling this target to completion.'
      operationId: dubbing_language_create
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the parent dubbing project.
          title: Project Id
        description: Identifier of the parent dubbing project.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Create_Dubbing_Language_Target_v1_dubbing_project__project_id__language_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingLanguageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - dubbing
      - project
      - language
      x-fern-sdk-method-name: create
      x-fern-examples:
      - path-parameters:
          project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
        request:
          target_language: es
        response:
          body:
            language_id: lang_1001kwkyxp0je6ktn4knsfrasx5s
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
            target_language: es
            status: queued
            model_id: dubbing_v2
            revision: 0
            warnings: []
            created_at: '2026-07-03T10:16:00Z'
            updated_at: '2026-07-03T10:16:00Z'
    get:
      tags:
      - Dubbing
      summary: List Dubbing Language Targets
      description: List a project's language targets, cursor-paginated, each with signed output URLs once it has produced an output.
      operationId: dubbing_language_list
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the parent dubbing project.
          title: Project Id
        description: Identifier of the parent dubbing project.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Pass the `next_cursor` from a previous response to fetch the page after it. Omit for the first page.
          title: Cursor
        description: Pass the `next_cursor` from a previous response to fetch the page after it. Omit for the first page.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Number of language targets per page. Clamped to between 1 and 100 rather than rejected, so a larger value returns a full page.
          default: 20
          title: Page Size
        description: Number of language targets per page. Clamped to between 1 and 100 rather than rejected, so a larger value returns a full page.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter to targets in this status: `queued`, `processing`, `completed`, `stale`, or `failed`. Omit to return every status.'
          title: Status
        description: 'Filter to targets in this status: `queued`, `processing`, `completed`, `stale`, or `failed`. Omit to return every status.'
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingLanguageListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - dubbing
      - project
      - language
      x-fern-sdk-method-name: list
      x-fern-examples:
      - path-parameters:
          project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
        query-parameters:
          page_size: 20
        response:
          body:
            languages:
            - language_id: lang_1001kwkyxp0je6ktn4knsfrasx5s
              project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
              target_language: es
              status: completed
              model_id: dubbing_v2
              outputs:
                lossless_audio: https://storage.googleapis.com/eleven-dubbing/proj_1601kwkyxp0hfzvtmyxwqxx6mcy3/lang_1001kwkyxp0je6ktn4knsfrasx5s/output.flac?X-Goog-Signature=...
              revision: 3
              output_revision: 3
              warnings: []
              created_at: '2026-07-03T10:16:00Z'
              updated_at: '2026-07-03T10:20:45Z'
  /v1/dubbing/project/{project_id}/language/{language_id}:
    get:
      tags:
      - Dubbing
      summary: Get Dubbing Language Target
      description: Full language-target detail. Once the target reports `completed`, `outputs` carries the signed download URLs. To learn when that happens, we recommend the project's `webhook_ids` subscription rather than polling this endpoint; fetch here when a delivered URL has expired, or to reconcile after an edit.
      operationId: dubbing_language_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the parent dubbing project.
          title: Project Id
        description: Identifier of the parent dubbing project.
      - name: language_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the language target to fetch.
          title: Language Id
        description: Identifier of the language target to fetch.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DubbingLanguageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - dubbing
      - project
      - language
      x-fern-sdk-method-name: get
      x-fern-examples:
      - path-parameters:
          project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
          language_id: lang_1001kwkyxp0je6ktn4knsfrasx5s
        response:
          body:
            language_id: lang_1001kwkyxp0je6ktn4knsfrasx5s
            project_id: proj_1601kwkyxp0hfzvtmyxwqxx6mcy3
            target_language: es
            status: completed
            model_id: dubbing_v2
            outputs:
              lossless_audio: https://storage.googleapis.com/eleven-dubbing/proj_1601kwkyxp0hfzvtmyxwqxx6mcy3/lang_1001kwkyxp0je6ktn4knsfrasx5s/output.flac?X-Goog-Signature=...
            revision: 3
            output_revision: 3
