openapi: 3.2.0
info:
  title: ElevenLabs API Documentation Speech Engine API
  description: This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically, this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.
  version: '1.0'
tags:
- name: Speech Engine
  description: Low-latency, real-time speech generation endpoints.
paths:
  /v1/speech-engine:
    get:
      tags:
      - Speech Engine
      summary: List Speech Engines
      description: Returns a paginated list of Speech Engine resources.
      operationId: list_speech_engines
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          description: How many Speech Engines to return at maximum. Can not exceed 100, defaults to 30.
          default: 30
          title: Page Size
        description: How many Speech Engines to return at maximum. Can not exceed 100, defaults to 30.
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search term to filter Speech Engines by name
          title: Search
        description: Search term to filter Speech Engines by name
      - name: sort_direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortDirection'
          description: The direction to sort the results
          default: desc
        description: The direction to sort the results
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AgentSortBy'
          - type: 'null'
          description: The field to sort the results by
          title: Sort By
        description: The field to sort the results by
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Used for fetching next page. Cursor is returned in the response.
          title: Cursor
        description: Used for fetching next page. Cursor is returned in the response.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSpeechEnginesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: speech_engine
      x-fern-sdk-method-name: list
    post:
      tags:
      - Speech Engine
      summary: Create Speech Engine
      description: Create a new Speech Engine resource
      operationId: create_speech_engine
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpeechEngineRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechEngineResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: speech_engine
      x-fern-sdk-method-name: create
  /v1/speech-engine/{speech_engine_id}:
    get:
      tags:
      - Speech Engine
      summary: Get Speech Engine
      description: Retrieve a Speech Engine resource
      operationId: get_speech_engine
      parameters:
      - name: speech_engine_id
        in: path
        required: true
        schema:
          type: string
          description: The speech engine ID (accepts seng_ or agent_ prefix)
          examples:
          - seng_3701k3ttaq12ewp8b7qv5rfyszkz
          title: Speech Engine Id
        description: The speech engine ID (accepts seng_ or agent_ prefix)
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechEngineResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: speech_engine
      x-fern-sdk-method-name: get
    patch:
      tags:
      - Speech Engine
      summary: Update Speech Engine
      description: Update a Speech Engine resource (partial update)
      operationId: update_speech_engine
      parameters:
      - name: speech_engine_id
        in: path
        required: true
        schema:
          type: string
          description: The speech engine ID (accepts seng_ or agent_ prefix)
          examples:
          - seng_3701k3ttaq12ewp8b7qv5rfyszkz
          title: Speech Engine Id
        description: The speech engine ID (accepts seng_ or agent_ prefix)
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpeechEngineRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechEngineResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: speech_engine
      x-fern-sdk-method-name: update
    delete:
      tags:
      - Speech Engine
      summary: Delete Speech Engine
      description: Delete a Speech Engine resource
      operationId: delete_speech_engine
      parameters:
      - name: speech_engine_id
        in: path
        required: true
        schema:
          type: string
          description: The speech engine ID (accepts seng_ or agent_ prefix)
          examples:
          - seng_3701k3ttaq12ewp8b7qv5rfyszkz
          title: Speech Engine Id
        description: The speech engine ID (accepts seng_ or agent_ prefix)
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: speech_engine
      x-fern-sdk-method-name: delete
components:
  schemas:
    PrivacyConfig-Input:
      properties:
        record_voice:
          type: boolean
          title: Record Voice
          description: Whether to record the conversation
          default: true
        retention_days:
          type: integer
          title: Retention Days
          description: The number of days to retain the conversation. -1 indicates there is no retention limit
          default: -1
        delete_transcript_and_pii:
          type: boolean
          title: Delete Transcript And Pii
          description: Whether to delete the transcript and PII
          default: false
        delete_audio:
          type: boolean
          title: Delete Audio
          description: Whether to delete the audio
          default: false
        apply_to_existing_conversations:
          type: boolean
          title: Apply To Existing Conversations
          description: Whether to apply the privacy settings to existing conversations
          default: false
        zero_retention_mode:
          type: boolean
          title: Zero Retention Mode
          description: Whether to enable zero retention mode - no PII data is stored
          default: false
        conversation_history_redaction:
          $ref: '#/components/schemas/ConversationHistoryRedactionConfig'
          description: Config for PII redaction in the conversation history
      type: object
      title: PrivacyConfig
      example:
        apply_to_existing_conversations: false
        delete_audio: false
        delete_transcript_and_pii: false
        record_voice: true
        retention_days: -1
        zero_retention_mode: false
    TTSConversationalConfig-Output:
      properties:
        model_id:
          $ref: '#/components/schemas/TTSConversationalModel'
          description: The model to use for TTS
          default: eleven_flash_v2
          x-convai-client-override: true
        voice_id:
          type: string
          minLength: 0
          title: Voice Id
          description: The voice ID to use for TTS
          default: cjVigY5qzO86Huf0OWal
          x-convai-client-override: true
          x-convai-language-override: true
        supported_voices:
          items:
            $ref: '#/components/schemas/SupportedVoice'
          type: array
          title: Supported Voices
          description: Additional supported voices for the agent
          x-convai-client-override: true
          x-convai-soft-override-disallowed: true
        expressive_mode:
          type: boolean
          title: Expressive Mode
          description: When enabled, applies expressive audio tags prompt. Automatically disabled for non-v3 models.
          default: true
        suggested_audio_tags:
          items:
            $ref: '#/components/schemas/SuggestedAudioTag'
          type: array
          maxItems: 20
          title: Suggested Audio Tags
          description: Suggested audio tags to boost expressive speech (for eleven_v3 and eleven_v3_conversational models). The agent can still use other tags not listed here.
        agent_output_audio_format:
          $ref: '#/components/schemas/TTSOutputFormat'
          description: The audio format to use for TTS
          default: pcm_16000
        optimize_streaming_latency:
          $ref: '#/components/schemas/TTSOptimizeStreamingLatency'
          description: 'Deprecated: this field is a no-op and is ignored.'
          default: 3
          deprecated: true
        stability:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Stability
          description: The stability of generated speech
          default: 0.5
          x-convai-client-override: true
        speed:
          type: number
          maximum: 1.2
          minimum: 0.7
          title: Speed
          description: The speed of generated speech
          default: 1.0
          x-convai-client-override: true
        similarity_boost:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Similarity Boost
          description: The similarity boost for generated speech
          default: 0.8
          x-convai-client-override: true
        text_normalisation_type:
          $ref: '#/components/schemas/TextNormalisationType'
          description: Method for converting numbers to words before converting text to speech. If set to SYSTEM_PROMPT, the system prompt will be updated to include normalization instructions. If set to ELEVENLABS, the text will be normalized after generation, incurring slight additional latency.
          default: system_prompt
        pronunciation_dictionary_locators:
          items:
            $ref: '#/components/schemas/PydanticPronunciationDictionaryVersionLocator'
          type: array
          title: Pronunciation Dictionary Locators
          description: The pronunciation dictionary locators
          x-convai-client-override: true
        enable_phoneme_tags:
          type: boolean
          title: Enable Phoneme Tags
          description: Opt-in to SSML phoneme tag handling for V3 models. When enabled, phoneme tags (inline and from pronunciation dictionaries) are parsed into inline IPA before being sent to the model.
          default: true
        audio_effects:
          anyOf:
          - $ref: '#/components/schemas/EffectsSpec-Output'
          - type: 'null'
          description: 'Optional TTS effects spec: filter preset, distance (proximity EQ), and environment (convolution reverb).'
      type: object
      title: TTSConversationalConfig
      example:
        agent_output_audio_format: pcm_16000
        model_id: eleven_turbo_v2
        optimize_streaming_latency: 3
        pronunciation_dictionary_locators: []
        similarity_boost: 0.8
        speed: 1.0
        stability: 0.5
        voice_id: cjVigY5qzO86Huf0OWal
    TurnEagerness:
      type: string
      enum:
      - patient
      - normal
      - eager
      title: TurnEagerness
      description: Agent's eagerness to respond. Higher values make agent wait for higher turn probability.
      default: normal
    TextNormalisationType:
      type: string
      enum:
      - system_prompt
      - elevenlabs
      title: TextNormalisationType
      description: Method for converting numbers to words before sending to TTS
      default: system_prompt
    EffectsSpec-Output:
      properties:
        filter_preset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Filter Preset Id
        distance:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Distance
          default: 0.0
        environment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment Id
        background_noise_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Background Noise Id
        send_level:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Send Level
          default: 1.0
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
      type: object
      required:
      - filter_preset_id
      - distance
      - environment_id
      - background_noise_id
      - send_level
      - seed
      title: EffectsSpec
      description: Filter preset, distance (proximity EQ), and environment (convolution reverb).
    ASRProvider:
      type: string
      enum:
      - elevenlabs
      - scribe_realtime
      title: ASRProvider
      x-fern-enum:
        elevenlabs:
          description: 'Deprecated: Use scribe_realtime instead.'
          deprecated: true
      default: scribe_realtime
    AgentMetadataDBModel:
      properties:
        created_at_unix_secs:
          type: integer
          title: Created At Unix Secs
        updated_at_unix_secs:
          type: integer
          title: Updated At Unix Secs
        created_from:
          $ref: '#/components/schemas/AgentDefinitionSource'
          default: unknown
        last_updated_from:
          $ref: '#/components/schemas/AgentDefinitionSource'
          default: unknown
      type: object
      required:
      - created_at_unix_secs
      - updated_at_unix_secs
      title: AgentMetadataDBModel
    ConversationConfig-Output:
      properties:
        text_only:
          type: boolean
          title: Text Only
          description: If enabled audio will not be processed and only text will be used, use to avoid audio pricing.
          default: false
          x-convai-client-override: true
        max_duration_seconds:
          type: integer
          title: Max Duration Seconds
          description: The maximum duration of a conversation in seconds
          default: 600
          x-convai-client-override: true
        client_events:
          items:
            $ref: '#/components/schemas/ClientEvent'
          type: array
          title: Client Events
          description: The events that will be sent to the client
        file_input:
          $ref: '#/components/schemas/FileInputConfig'
          description: Configuration for file input (image/PDF uploads) during conversations.
          x-convai-client-override: true
        monitoring_enabled:
          type: boolean
          title: Monitoring Enabled
          description: Enable real-time monitoring of conversations via WebSocket
          default: false
        monitoring_events:
          items:
            $ref: '#/components/schemas/ClientEvent'
          type: array
          title: Monitoring Events
          description: The events that will be sent to monitoring connections.
        dtmf_input_settings:
          anyOf:
          - $ref: '#/components/schemas/DTMFInputConfig'
          - type: 'null'
          description: Configure DTMF (keypad) input collection during phone calls
        background_sound:
          $ref: '#/components/schemas/BackgroundSoundConfig'
          description: Configuration for background sound during conversations.
        source_attribution:
          type: boolean
          title: Source Attribution
          description: When enabled and knowledge base content is present, the LLM is instructed to report which sources it used.
          default: false
      type: object
      title: ConversationConfig
      example:
        client_events:
        - audio
        - interruption
        max_duration_seconds: 600
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    SpeechEngineResponse:
      properties:
        speech_engine_id:
          type: string
          title: Speech Engine Id
          description: The speech engine resource ID
        name:
          type: string
          title: Name
          description: Human-readable name for the speech engine
        speech_engine:
          $ref: '#/components/schemas/SpeechEngineConfig'
          description: WebSocket connection settings for the upstream transcript server
        asr:
          $ref: '#/components/schemas/ASRConversationalConfig'
          description: Automatic speech recognition configuration
        tts:
          $ref: '#/components/schemas/TTSConversationalConfig-Output'
          description: Text-to-speech output configuration
        turn:
          $ref: '#/components/schemas/BaseTurnConfig'
          description: Turn detection configuration
        vad:
          $ref: '#/components/schemas/VADConfig'
          description: Configuration for voice activity detection
        conversation:
          $ref: '#/components/schemas/ConversationConfig-Output'
          description: Conversation-level settings including client events and duration limits
        privacy:
          $ref: '#/components/schemas/PrivacyConfig-Output'
          description: Privacy settings controlling recording, retention, and PII handling
        call_limits:
          $ref: '#/components/schemas/AgentCallLimits'
          description: Concurrency and daily conversation limits for this speech engine
        language:
          type: string
          title: Language
          description: ISO language code used by the speech engine (e.g. 'en')
        cascade_timeout_seconds:
          type: number
          title: Cascade Timeout Seconds
          description: Time in seconds to wait for the upstream speech engine endpoint to respond before the attempt is abandoned and retried. Must be between 2 and 15 seconds.
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Arbitrary tags for categorization and filtering
        overrides:
          $ref: '#/components/schemas/SpeechEngineConversationInitiationClientDataConfig'
          description: Override settings the client may set during conversation initiation
        metadata:
          $ref: '#/components/schemas/AgentMetadataDBModel'
          description: Creation and update timestamps with source information
        access_info:
          anyOf:
          - $ref: '#/components/schemas/ResourceAccessInfo'
          - type: 'null'
          description: The access information of the speech engine for the user
      type: object
      required:
      - speech_engine_id
      - name
      - speech_engine
      - asr
      - tts
      - turn
      - vad
      - conversation
      - privacy
      - call_limits
      - language
      - cascade_timeout_seconds
      - tags
      - overrides
      - metadata
      title: SpeechEngineResponse
      example:
        asr:
          keywords: []
          provider: elevenlabs
          quality: high
          user_input_audio_format: pcm_16000
        call_limits:
          agent_concurrency_limit: -1
          bursting_enabled: true
          daily_limit: 100000
        cascade_timeout_seconds: 4.0
        conversation:
          client_events:
          - audio
          - interruption
          - agent_response
          - user_transcript
          max_duration_seconds: 600
        language: en
        metadata:
          created_at_unix_secs: 1714000000
          created_from: api
          last_updated_from: api
          updated_at_unix_secs: 1714000000
        name: My Speech Engine
        overrides:
          first_message: false
        privacy:
          apply_to_existing_conversations: false
          delete_audio: false
          delete_transcript_and_pii: false
          record_voice: true
          retention_days: -1
          zero_retention_mode: false
        speech_engine:
          request_headers: {}
          ws_url: wss://example.com/transcript
        speech_engine_id: seng_3701k3ttaq12ewp8b7qv5rfyszkz
        tags:
        - production
        - v1
        tts:
          agent_output_audio_format: pcm_16000
          model_id: eleven_flash_v2
          optimize_streaming_latency: 3
          similarity_boost: 0.8
          speed: 1.0
          stability: 0.5
          voice_id: cjVigY5qzO86Huf0OWal
        turn:
          mode: turn
          silence_end_call_timeout: -1
          turn_eagerness: normal
          turn_timeout: 7.0
        vad:
          background_voice_detection: false
    SupportedVoice:
      properties:
        label:
          type: string
          minLength: 1
          title: Label
        voice_id:
          type: string
          minLength: 1
          title: Voice Id
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        model_family:
          anyOf:
          - $ref: '#/components/schemas/TTSModelFamily'
          - type: 'null'
        optimize_streaming_latency:
          anyOf:
          - $ref: '#/components/schemas/TTSOptimizeStreamingLatency'
          - type: 'null'
        stability:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Stability
        speed:
          anyOf:
          - type: number
            maximum: 1.2
            minimum: 0.7
          - type: 'null'
          title: Speed
        similarity_boost:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Similarity Boost
      type: object
      required:
      - label
      - voice_id
      title: SupportedVoice
    SortDirection:
      type: string
      enum:
      - asc
      - desc
      title: SortDirection
    BaseTurnConfig:
      properties:
        turn_timeout:
          type: number
          title: Turn Timeout
          description: Maximum wait time for the user's reply before re-engaging the user
          default: 7.0
        initial_wait_time:
          anyOf:
          - type: number
          - type: 'null'
          title: Initial Wait Time
          description: How long the agent will wait for the user to start the conversation if the first message is empty. If not set, uses the regular turn_timeout.
        silence_end_call_timeout:
          type: number
          title: Silence End Call Timeout
          description: Maximum wait time since the user last spoke before terminating the call
          default: -1
        mode:
          $ref: '#/components/schemas/TurnMode'
          description: The mode of turn detection
          default: turn
          x-fern-ignore: true
        turn_eagerness:
          $ref: '#/components/schemas/TurnEagerness'
          description: Controls how eager the agent is to respond. Low = less eager (waits longer), Standard = default eagerness, High = more eager (responds sooner)
          default: normal
        spelling_patience:
          $ref: '#/components/schemas/SpellingPatience'
          description: Controls if the agent should be more patient when user is spelling numbers and named entities. Auto = model based, Off = never wait extra
          default: auto
        speculative_turn:
          type: boolean
          title: Speculative Turn
          description: When enabled, starts generating LLM responses during silence before full turn confidence is reached, reducing perceived latency. May increase LLM costs.
          default: false
        retranscribe_on_turn_timeout:
          type: boolean
          title: Retranscribe On Turn Timeout
          description: When enabled, if VAD detects no speech, attempts to re-transcribe accumulated audio at turn timeout. Disables silence discount billing for affected turns.
          default: false
        turn_model:
          $ref: '#/components/schemas/TurnModel'
          default: turn_v3
        interruption_ignore_terms:
          items:
            type: string
          type: array
          title: Interruption Ignore Terms
          description: List of terms that should not trigger an interruption when spoken by the user (e.g. 'gotcha', 'understood'). Uses case-insensitive exact matching.
        interruption_ignore_term_languages:
          items:
            type: string
          type: array
          title: Interruption Ignore Term Languages
          description: Language codes for which preset ignore-term categories have been activated. Stored explicitly so display is not inferred from term overlap.
        merge_with_default_ignore_terms:
          type: boolean
          title: Merge With Default Ignore Terms
          description: When enabled, the curated default terms for interruption_ignore_term_languages are used in addition to interruption_ignore_terms.
          default: false
        transcribe_on_disabled_interruptions:
          type: boolean
          title: Transcribe On Disabled Interruptions
