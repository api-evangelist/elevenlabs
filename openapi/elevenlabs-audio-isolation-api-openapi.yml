openapi: 3.2.0
info:
  title: ElevenLabs API Documentation Audio Isolation API
  description: This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically, this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.
  version: '1.0'
tags:
- name: audio-isolation
  description: Isolate speech from background noise in an audio file.
paths:
  /v1/audio-isolation:
    post:
      tags:
      - audio-isolation
      summary: Audio Isolation
      description: Removes background noise from audio
      operationId: audio_isolation
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Audio_Isolation_v1_audio_isolation_post'
      responses:
        '200':
          description: Successful Response
          content:
            audio/mpeg: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: audio_isolation
      x-fern-sdk-method-name: convert
  /v1/audio-isolation/history:
    get:
      tags:
      - audio-isolation
      summary: Get Audio Isolation History
      description: Returns a list of all your audio isolation generations.
      operationId: get_audio_isolation_history
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: How many history items to return at maximum. Defaults to 100.
          default: 100
          title: Page Size
        description: How many history items to return at maximum. Defaults to 100.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number for search pagination (1-based). Only used when search is provided.
          default: 1
          title: Page
        description: Page number for search pagination (1-based). Only used when search is provided.
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional search term used for filtering audio isolation history (title/text).
          examples:
          - podcast
          - lecture
          title: Search
        description: Optional search term used for filtering audio isolation history (title/text).
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAudioIsolationHistoryResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: audio_isolation
      x-fern-sdk-method-name: list
  /v1/audio-isolation/history/{history_item_id}:
    delete:
      tags:
      - audio-isolation
      summary: Delete Audio Isolation History Item
      description: Deletes a specific audio isolation history item and the associated media files.
      operationId: delete_audio_isolation_history_item
      parameters:
      - name: history_item_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the audio isolation history item.
          title: History Item Id
        description: Identifier of the audio isolation history item.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: audio_isolation
      x-fern-sdk-method-name: delete
  /v1/audio-isolation/stream:
    post:
      tags:
      - audio-isolation
      summary: Audio Isolation Stream
      description: Removes background noise from audio and streams the result
      operationId: audio_isolation_stream
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Audio_Isolation_Stream_v1_audio_isolation_stream_post'
      responses:
        '200':
          description: Successful Response
          content:
            audio/mpeg: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: audio_isolation
      x-fern-sdk-method-name: stream
      x-fern-streaming: true
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    GetAudioIsolationHistoryResponseModel:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AudioIsolationHistoryItemResponseModel'
          type: array
          title: Items
        has_more:
          type: boolean
          title: Has More
      type: object
      required:
      - items
      - has_more
      title: GetAudioIsolationHistoryResponseModel
    Body_Audio_Isolation_v1_audio_isolation_post:
      properties:
        audio:
          type: string
          title: Audio
          description: The audio file from which vocals/speech will be isolated from.
          format: binary
        file_format:
          anyOf:
          - type: string
            enum:
            - pcm_s16le_16
            - other
          - type: 'null'
          title: File Format
          description: The format of input audio. Options are 'pcm_s16le_16' or 'other' For `pcm_s16le_16`, the input audio must be 16-bit PCM at a 16kHz sample rate, single channel (mono), and little-endian byte order. Latency will be lower than with passing an encoded waveform.
          default: other
          examples:
          - pcm_s16le_16
          - other
        preview_b64:
          anyOf:
          - type: string
          - type: 'null'
          title: Preview B64
          description: Optional preview image base64 for tracking this generation.
      type: object
      required:
      - audio
      title: Body_Audio_Isolation_v1_audio_isolation_post
    Body_Audio_Isolation_Stream_v1_audio_isolation_stream_post:
      properties:
        audio:
          type: string
          title: Audio
          description: The audio file from which vocals/speech will be isolated from.
          format: binary
        file_format:
          anyOf:
          - type: string
            enum:
            - pcm_s16le_16
            - other
          - type: 'null'
          title: File Format
          description: The format of input audio. Options are 'pcm_s16le_16' or 'other' For `pcm_s16le_16`, the input audio must be 16-bit PCM at a 16kHz sample rate, single channel (mono), and little-endian byte order. Latency will be lower than with passing an encoded waveform.
          default: other
          examples:
          - pcm_s16le_16
          - other
      type: object
      required:
      - audio
      title: Body_Audio_Isolation_Stream_v1_audio_isolation_stream_post
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AudioIsolationHistoryItemResponseModel:
      properties:
        id:
          type: string
          title: Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        created_at_unix:
          type: integer
          title: Created At Unix
        format:
          type: string
          title: Format
        duration_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration Seconds
        download_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Download Url
        icon_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Icon Url
        source_video_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Video Url
        supports_video:
          type: boolean
          title: Supports Video
        processing:
          type: boolean
          title: Processing
        video_processing_failed:
          type: boolean
          title: Video Processing Failed
        preview_b64:
          anyOf:
          - type: string
          - type: 'null'
          title: Preview B64
      type: object
      required:
      - id
      - title
      - created_at_unix
      - format
      - duration_seconds
      - download_url
      - icon_url
      - source_video_url
      - supports_video
      - processing
      - video_processing_failed
      - preview_b64
      title: AudioIsolationHistoryItemResponseModel
