openapi: 3.2.0
info:
  title: ElevenLabs API Documentation Music Generation API
  description: This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically, this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.
  version: '1.0'
tags:
- name: music-generation
  description: Generate music from a text prompt.
paths:
  /v1/music/plan:
    post:
      tags:
      - music-generation
      summary: Generate Composition Plan
      description: Generate a composition plan from a prompt.
      operationId: compose_plan
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Generate_composition_plan_v1_music_plan_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/MusicPrompt'
                - $ref: '#/components/schemas/CompositionPlan'
                title: Response Generate Composition Plan V1 Music Plan Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - music
      - composition_plan
      x-fern-sdk-method-name: create
  /v1/music:
    post:
      tags:
      - music-generation
      summary: Compose Music
      description: Compose a song from a prompt or a composition plan.
      operationId: generate
      parameters:
      - name: output_format
        in: query
        required: false
        schema:
          type: string
          enum:
          - auto
          - mp3_48000_128
          - mp3_48000_192
          - mp3_48000_240
          - mp3_48000_320
          - mp3_22050_32
          - mp3_24000_48
          - mp3_44100_32
          - mp3_44100_64
          - mp3_44100_96
          - mp3_44100_128
          - mp3_44100_192
          - pcm_8000
          - pcm_16000
          - pcm_22050
          - pcm_24000
          - pcm_32000
          - pcm_44100
          - pcm_48000
          - ulaw_8000
          - alaw_8000
          - opus_48000_32
          - opus_48000_64
          - opus_48000_96
          - opus_48000_128
          - opus_48000_192
          default: auto
          title: Output format of the generated audio.
        description: 'Output format of the generated audio. Formatted as codec_sample_rate_bitrate. Use "auto" (the default) to let the API pick the best format for the selected model: mp3_44100_128 for v1 models and mp3_48000_192 for v2 models. '
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Compose_music_v1_music_post'
      responses:
        '200':
          description: The generated audio file in the format specified
          content:
            audio/*:
              schema:
                type: string
                format: binary
          headers:
            song-id:
              description: Unique identifier for the generated song
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: music
      x-fern-sdk-method-name: compose
  /v1/music/detailed:
    post:
      tags:
      - music-generation
      summary: Compose Music With A Detailed Response
      description: Compose a song from a prompt or a composition plan.
      operationId: compose_detailed
      parameters:
      - name: output_format
        in: query
        required: false
        schema:
          type: string
          enum:
          - auto
          - mp3_48000_128
          - mp3_48000_192
          - mp3_48000_240
          - mp3_48000_320
          - mp3_22050_32
          - mp3_24000_48
          - mp3_44100_32
          - mp3_44100_64
          - mp3_44100_96
          - mp3_44100_128
          - mp3_44100_192
          - pcm_8000
          - pcm_16000
          - pcm_22050
          - pcm_24000
          - pcm_32000
          - pcm_44100
          - pcm_48000
          - ulaw_8000
          - alaw_8000
          - opus_48000_32
          - opus_48000_64
          - opus_48000_96
          - opus_48000_128
          - opus_48000_192
          default: auto
          title: Output format of the generated audio.
        description: 'Output format of the generated audio. Formatted as codec_sample_rate_bitrate. Use "auto" (the default) to let the API pick the best format for the selected model: mp3_44100_128 for v1 models and mp3_48000_192 for v2 models. '
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Compose_Music_with_a_detailed_response_v1_music_detailed_post'
      responses:
        '200':
          description: Multipart/mixed response with JSON metadata and binary audio file
          content:
            multipart/mixed:
              schema:
                type: string
                format: binary
                description: 'Raw multipart/mixed response data that clients must parse. Contains two parts separated by boundary: 1) application/json part with composition_plan and song_metadata 2) audio/* part with binary audio data and Content-Disposition header'
          headers:
            song-id:
              description: Unique identifier for the generated song
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: music
      x-fern-sdk-method-name: compose_detailed
  /v1/music/detailed/stream:
    post:
      tags:
      - music-generation
      summary: Stream Composed Music With A Detailed Response
      description: Stream a song and its detailed metadata using Server-Sent Events (SSE).
      operationId: compose_detailed_stream
      parameters:
      - name: output_format
        in: query
        required: false
        schema:
          type: string
          enum:
          - auto
          - mp3_48000_128
          - mp3_48000_192
          - mp3_48000_240
          - mp3_48000_320
          - mp3_22050_32
          - mp3_24000_48
          - mp3_44100_32
          - mp3_44100_64
          - mp3_44100_96
          - mp3_44100_128
          - mp3_44100_192
          - pcm_8000
          - pcm_16000
          - pcm_22050
          - pcm_24000
          - pcm_32000
          - pcm_44100
          - pcm_48000
          - ulaw_8000
          - alaw_8000
          - opus_48000_32
          - opus_48000_64
          - opus_48000_96
          - opus_48000_128
          - opus_48000_192
          default: auto
          title: Output format of the generated audio.
        description: 'Output format of the generated audio. Formatted as codec_sample_rate_bitrate. Use "auto" (the default) to let the API pick the best format for the selected model: mp3_44100_128 for v1 models and mp3_48000_192 for v2 models. '
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Stream_composed_music_with_a_detailed_response_v1_music_detailed_stream_post'
      responses:
        '200':
          description: Server-Sent Events for composition plan, song metadata, audio chunks with optional word timestamps and visual waveform, and completion.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream. Audio chunks are emitted as base64-encoded payloads in audio_chunk events, alongside `words_timestamps` and `waveform_visual` slices, each filled in only when its opt-in flag is set and sent as an empty list otherwise. Joining the `waveform_visual` slices in arrival order gives the visual waveform of the whole song.
          headers:
            song-id:
              description: Unique identifier for the generated song
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: music
      x-fern-sdk-method-name: compose_detailed_stream
      x-fern-streaming: true
  /v1/music/stream:
    post:
      tags:
      - music-generation
      summary: Stream Composed Music
      description: Stream a composed song from a prompt or a composition plan.
      operationId: stream_compose
      parameters:
      - name: output_format
        in: query
        required: false
        schema:
          type: string
          enum:
          - auto
          - mp3_48000_128
          - mp3_48000_192
          - mp3_48000_240
          - mp3_48000_320
          - mp3_22050_32
          - mp3_24000_48
          - mp3_44100_32
          - mp3_44100_64
          - mp3_44100_96
          - mp3_44100_128
          - mp3_44100_192
          - pcm_8000
          - pcm_16000
          - pcm_22050
          - pcm_24000
          - pcm_32000
          - pcm_44100
          - pcm_48000
          - ulaw_8000
          - alaw_8000
          - opus_48000_32
          - opus_48000_64
          - opus_48000_96
          - opus_48000_128
          - opus_48000_192
          default: auto
          title: Output format of the generated audio.
        description: 'Output format of the generated audio. Formatted as codec_sample_rate_bitrate. Use "auto" (the default) to let the API pick the best format for the selected model: mp3_44100_128 for v1 models and mp3_48000_192 for v2 models. '
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Stream_composed_music_v1_music_stream_post'
      responses:
        '200':
          description: Streaming audio data in the format specified
          content:
            audio/*:
              schema:
                type: string
                format: binary
          headers:
            song-id:
              description: Unique identifier for the generated song
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: music
      x-fern-sdk-method-name: stream
      x-fern-streaming: true
  /v1/music/upload:
    post:
      tags:
      - music-generation
      summary: Upload Music
      description: Upload a music file to be later used for inpainting. Price for uploading is the same as the one for song generation. All uploaded content gets inspected for copyright infringement. If copyrighted content is detected, half of the request cost is still charged.
      operationId: upload_song
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Upload_music_v1_music_upload_post'
      responses:
        '200':
          description: Successfully uploaded music file with optional composition plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: music
      x-fern-sdk-method-name: upload
  /v1/music/stem-separation:
    post:
      tags:
      - music-generation
      summary: Stem Separation
      description: Separate an audio file into individual stems. This endpoint might have high latency, depending on the length of the audio file.
      operationId: separate_song_stems
      parameters:
      - name: output_format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AllowedOutputFormats'
          title: Output format of the generated audio.
          description: Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.
          enum:
          - mp3_22050_32
          - mp3_24000_48
          - mp3_44100_32
          - mp3_44100_64
          - mp3_44100_96
          - mp3_44100_128
          - mp3_44100_192
          - pcm_8000
          - pcm_16000
          - pcm_22050
          - pcm_24000
          - pcm_32000
          - pcm_44100
          - pcm_48000
          - ulaw_8000
          - alaw_8000
          - opus_48000_32
          - opus_48000_64
          - opus_48000_96
          - opus_48000_128
          - opus_48000_192
          default: mp3_44100_128
        description: Output format of the generated audio. Formatted as codec_sample_rate_bitrate. So an mp3 with 22.05kHz sample rate at 32kbs is represented as mp3_22050_32. MP3 with 192kbps bitrate requires you to be subscribed to Creator tier or above. PCM with 44.1kHz sample rate requires you to be subscribed to Pro tier or above. Note that the μ-law format (sometimes written mu-law, often approximated as u-law) is commonly used for Twilio audio inputs.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Stem_separation_v1_music_stem_separation_post'
      responses:
        '200':
          description: ZIP archive containing separated audio stems. Each stem is provided as a separate audio file in the requested output format.
          content:
            application/zip:
              schema:
                type: string
                format: binary
              example: 'Binary ZIP file containing files like: vocals.mp3, drums.mp3, bass.mp3, guitar.mp3, piano.mp3, other.mp3'
          headers:
            Content-Disposition:
              description: Attachment header with filename
              schema:
                type: string
                example: attachment; filename=stems.zip
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: music
      x-fern-sdk-method-name: separate_stems
components:
  schemas:
    Body_Stream_composed_music_v1_music_stream_post:
      properties:
        prompt:
          anyOf:
          - type: string
            maxLength: 4100
          - type: 'null'
          title: Prompt
          description: A simple text prompt to generate a song from. Cannot be used in conjunction with `composition_plan`.
        generation_mode:
          anyOf:
          - $ref: '#/components/schemas/MusicGenerationMode'
          - type: 'null'
          description: Optional generation mode hint for prompt-based music generation. Can only be used with `prompt`.
          x-fern-ignore: true
        music_prompt:
          anyOf:
          - $ref: '#/components/schemas/MusicPrompt'
          - type: 'null'
          description: A music prompt. Deprecated. Use `composition_plan` instead.
          deprecated: true
          x-fern-ignore: true
        lyrics_text:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Lyrics Text
          description: The lyrics text to use for the generation.
          x-fern-ignore: true
        composition_plan:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/MusicPrompt'
            - $ref: '#/components/schemas/CompositionPlan'
          - type: 'null'
          title: Composition Plan
          description: A detailed composition plan to guide music generation. Cannot be used in conjunction with `prompt`.
        music_length_ms:
          anyOf:
          - type: integer
            maximum: 600000.0
            minimum: 3000.0
          - type: 'null'
          title: Music Length Ms
          description: The length of the song to generate in milliseconds. Used only in conjunction with `prompt`. Must be between 3000ms and 600000ms. Optional - if not provided, the model will choose a length based on the prompt.
        model_id:
          $ref: '#/components/schemas/MusicModelID'
          description: The model to use for the generation.
          default: music_v1
        seed:
          anyOf:
          - type: integer
            maximum: 2147483647.0
            minimum: 0.0
          - type: 'null'
          title: Seed
          description: Random seed to initialize the music generation process. Providing the same seed with the same parameters can help achieve more consistent results, but exact reproducibility is not guaranteed and outputs may change across system updates. Cannot be used in conjunction with prompt.
        force_instrumental:
          type: boolean
          title: Force Instrumental
          description: If true, guarantees that the generated song will be instrumental. If false, the song may or may not be instrumental depending on the `prompt`. Can only be used with `prompt`.
          default: false
        finetune_id:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Finetune Id
          description: The ID of the finetune to use for the generation
        finetune_strength:
          type: number
          maximum: 2.0
          exclusiveMinimum: 0.0
          title: Finetune Strength
          description: How strongly the finetune influences the generation. Defaults to 1.0 (full strength). Lower values soften the influence of the finetune, leaving more room for prompt-level steering. Only meaningful when `finetune_id` is also provided.
          default: 1.0
          x-fern-ignore: true
        use_phonetic_names:
          type: boolean
          title: Use Phonetic Names
          description: If true, proper names in the prompt will be phonetically spelled in the lyrics for better pronunciation by the music model. The original names will be restored in word timestamps.
          default: false
          x-fern-ignore: true
        store_for_inpainting:
          type: boolean
          title: Store For Inpainting
          description: Whether to store the generated song for inpainting.
          default: false
      type: object
      title: Body_Stream_composed_music_v1_music_stream_post
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    SectionSource:
      properties:
        song_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Song Id
          description: The ID of the song to source the section from. You can find the song ID in the response headers when you generate a song.
        range:
          $ref: '#/components/schemas/TimeRange'
          description: The range to extract from the source song.
        negative_ranges:
          items:
            $ref: '#/components/schemas/TimeRange'
          type: array
          maxItems: 10
          title: Negative Ranges
          description: The ranges to exclude from the 'range'.
      type: object
      required:
      - song_id
      - range
      title: SectionSource
    Body_Generate_composition_plan_v1_music_plan_post:
      properties:
        prompt:
          type: string
          maxLength: 4100
          title: Prompt
          description: A simple text prompt to compose a plan from.
        music_length_ms:
          anyOf:
          - type: integer
            maximum: 600000.0
            minimum: 3000.0
          - type: 'null'
          title: Music Length Ms
          description: The length of the composition plan to generate in milliseconds. Must be between 3000ms and 600000ms. Optional - if not provided, the model will choose a length based on the prompt.
        source_composition_plan:
          anyOf:
          - $ref: '#/components/schemas/MusicPrompt'
          - $ref: '#/components/schemas/CompositionPlan'
          - type: 'null'
          title: Source Composition Plan
          description: An optional composition plan to use as a source for the new composition plan.
        model_id:
          $ref: '#/components/schemas/MusicModelID'
          description: The model to use for the generation.
          default: music_v1
      type: object
      required:
      - prompt
      title: Body_Generate_composition_plan_v1_music_plan_post
    GenerationChunk-Input:
      properties:
        text:
          type: string
          maxLength: 6132
          title: Text
          description: The text config to be generated for this chunk. Can contain an optional section name in square brackets at the beginning, e.g. [Verse 1], lyrics lines, and inline directions in curly braces, e.g. {scratching}. Section names must be between 1 and 100 characters. At most 30 lines are allowed, each at most 200 characters.
        duration_ms:
          type: integer
          maximum: 120000.0
          minimum: 3000.0
          title: Duration Ms
          description: The duration of the chunk in milliseconds. Must be between 3000ms and 120000ms.
        positive_styles:
          items:
            type: string
          type: array
          maxItems: 50
          title: Positive Styles
          description: The styles and musical directions that should be present in this chunk. Use English language for best results. The styles for the first chunk are the most important as they set the overall tone and genre. Styles for subsequent chunks can be used to add nuance, progression, emphasis, or change the direction of the song. Aim to have at least 6-7 styles in early chunks until the direction is established. Generic styles like 'great production quality' are good default styles to append to the list.
        negative_styles:
          items:
            type: string
          type: array
          maxItems: 50
          title: Negative Styles
          description: The styles and musical directions that should not be present in this chunk. Use English language for best results. Leaving empty is a good default, only use this field if you want to explicitly avoid a particular style or direction.
        context_adherence:
          type: string
          enum:
          - low
          - medium
          - high
          title: Context Adherence
          description: How much the model adheres to the context of its surrounding chunks. Low adherence means the model can deviate from the context and be more creative. High adherence means the model will be more consistent with the context.
          default: high
        conditioning_ref:
          anyOf:
          - $ref: '#/components/schemas/AudioRefChunk'
          - type: 'null'
          description: The audio reference to condition the generation on. The first chunk is the most important as it will influence the generation of all subsequent chunks. Thus, if you want to apply conditioning to the entire song, start conditioning from the first chunk.
        condition_strength:
          anyOf:
          - type: string
            enum:
            - low
            - medium
            - high
            - xhigh
          - type: 'null'
          title: Condition Strength
          description: How strongly the model adheres to the conditioning reference. Low strength means the model will be more creative and deviate from the reference. High strength means the model will be more consistent with the reference.
      type: object
      required:
      - text
      - duration_ms
      - positive_styles
      title: GenerationChunk
    Body_Compose_music_v1_music_post:
      properties:
        prompt:
          anyOf:
          - type: string
            maxLength: 4100
          - type: 'null'
          title: Prompt
          description: A simple text prompt to generate a song from. Cannot be used in conjunction with `composition_plan`.
        generation_mode:
          anyOf:
          - $ref: '#/components/schemas/MusicGenerationMode'
          - type: 'null'
