components:
  schemas:
    MediaGenerationInProgressResponse:
      properties:
        id:
          type: string
          title: Id
          description: The unique identifier of the generation.
          examples:
          - JWr5N6X9ZTqf8jD2LmQb
        status:
          type: string
          enum:
          - pending
          - generating
          title: Status
          description: The lifecycle status of the generation. It ends at `completed` or `failed`.
          examples:
          - generating
      type: object
      required:
      - id
      - status
      title: MediaGenerationInProgressResponse
      description: A media generation that has not finished yet.
      example:
        id: JWr5N6X9ZTqf8jD2LmQb
        status: generating
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    MediaGenerationFailedResponse:
      properties:
        id:
          type: string
          title: Id
          description: The unique identifier of the generation.
          examples:
          - JWr5N6X9ZTqf8jD2LmQb
        status:
          type: string
          const: failed
          title: Status
          description: The lifecycle status of the generation.
          examples:
          - failed
        failure_reason:
          type: string
          enum:
          - timeout
          - model_error
          - moderated
          - invalid_parameters
          - dependency_failed
          - charging_failed
          - internal_error
          title: Failure Reason
          description: The category of failure.
          examples:
          - timeout
        error_message:
          type: string
          title: Error Message
          description: A human-readable description of the failure. Failed generations are not charged.
          examples:
          - Timed out while processing. You were not charged for this generation.
      type: object
      required:
      - id
      - status
      - failure_reason
      - error_message
      title: MediaGenerationFailedResponse
      description: A failed media generation and why it failed.
      example:
        error_message: Timed out while processing. You were not charged for this generation.
        failure_reason: timeout
        id: JWr5N6X9ZTqf8jD2LmQb
        status: failed
    InlineAudioReference:
      properties:
        type:
          type: string
          const: inline_base64
          title: Type
        content_base64:
          type: string
          maxLength: 34952536
          title: Content Base64
          description: The media file's bytes, base64-encoded (standard alphabet). Up to 25MB decoded.
          examples:
          - iVBORw0KGgoAAAANSUhEUgAA...
        mime_type:
          type: string
          enum:
          - audio/mpeg
          - audio/wav
          title: Mime Type
          description: The MIME type of the encoded audio.
      additionalProperties: false
      type: object
      required:
      - type
      - content_base64
      - mime_type
      title: InlineAudioReference
      description: 'Audio passed inline as base64. The audio is stored as an ephemeral

        asset with no guaranteed retention: it may be deleted at any time after

        the generation completes. To keep an input and reuse it across

        generations, upload it via the assets API (`POST /v1/assets`) and pass

        an `asset` reference instead.'
    Veo3_1FastRequest:
      properties:
        webhook:
          anyOf:
          - $ref: '#/components/schemas/WebhookTarget'
          - type: 'null'
          description: Include to send the generation's result to the workspace's configured flows webhooks once it completes or fails. The webhook payload matches the terminal response of the corresponding GET endpoint.
          examples:
          - type: all
          - ids:
            - Q8mVr2LpXcT4nB6yJdKw
            type: ids
        prompt:
          type: string
          title: Prompt
          description: A text description of the video to generate.
          examples:
          - A corgi rides a tiny surfboard across a sunlit wave at golden hour, cinematic
        negative_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Negative Prompt
          description: A text description of what the video should avoid.
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
          description: 'A seed for reproducible generation: the same seed and inputs give similar output across generations. Omit for random.'
        enhance_prompt:
          type: boolean
          title: Enhance Prompt
          description: Whether the model may rewrite the prompt to improve results.
          default: true
        duration_secs:
          type: integer
          enum:
          - 4
          - 6
          - 8
          title: Duration Secs
          description: The duration of the output video in seconds.
          default: 8
        aspect_ratio:
          type: string
          enum:
          - '16:9'
          - '9:16'
          title: Aspect Ratio
          description: The aspect ratio of the output video.
          default: '16:9'
        resolution:
          type: string
          enum:
          - 720p
          - 1080p
          - 4K
          title: Resolution
          description: The resolution of the output video.
          default: 720p
        generate_audio:
          type: boolean
          title: Generate Audio
          description: Whether to generate audio with the video.
          default: true
        start_frame:
          anyOf:
          - $ref: '#/components/schemas/ImageReference'
          - type: 'null'
          description: The image to use as the video's first frame.
        end_frame:
          anyOf:
          - $ref: '#/components/schemas/ImageReference'
          - type: 'null'
          description: The image to use as the video's last frame.
        images:
          items:
            $ref: '#/components/schemas/VeoImageReference'
          type: array
          maxItems: 3
          title: Images
          description: Up to 3 reference images to draw subjects or style from. Cannot be combined with `start_frame`/`end_frame`, and requires the 8-second duration.
        model_id:
          type: string
          const: veo-3.1-fast-generate-001
          title: Model Id
          description: The model to use for the generation.
      additionalProperties: false
      type: object
      required:
      - prompt
      - model_id
      title: Veo3_1FastRequest
      description: Request body for the Google Veo 3.1 Fast video model.
    Gemini31FlashLiteImageRequest:
      properties:
        webhook:
          anyOf:
          - $ref: '#/components/schemas/WebhookTarget'
          - type: 'null'
          description: Include to send the generation's result to the workspace's configured flows webhooks once it completes or fails. The webhook payload matches the terminal response of the corresponding GET endpoint.
          examples:
          - type: all
          - ids:
            - Q8mVr2LpXcT4nB6yJdKw
            type: ids
        prompt:
          type: string
          title: Prompt
          description: A text description of the image to generate.
          examples:
          - A corgi in a tiny lifeguard chair on a sunlit beach at golden hour, photorealistic
        model_id:
          type: string
          const: gemini-3.1-flash-lite-image
          title: Model Id
          description: The model to use for the generation.
        images:
          items:
            $ref: '#/components/schemas/ImageReference'
          type: array
          maxItems: 14
          title: Images
          description: Up to 14 reference images to edit or draw from.
        aspect_ratio:
          type: string
          enum:
          - auto
          - '1:1'
          - '2:3'
          - '3:2'
          - '3:4'
          - '4:3'
          - '4:5'
          - '5:4'
          - '9:16'
          - '16:9'
          - '21:9'
          title: Aspect Ratio
          description: The aspect ratio of the output image. With `auto`, the model picks an aspect ratio based on the inputs.
          default: '16:9'
        resolution:
          type: string
          const: 1K
          title: Resolution
          description: The resolution of the output image.
          default: 1K
      additionalProperties: false
      type: object
      required:
      - prompt
      - model_id
      title: Gemini31FlashLiteImageRequest
      description: Request body for the Google Gemini 3.1 Flash Lite image model.
    MediaGenerationCompletedResponse:
      properties:
        id:
          type: string
          title: Id
          description: The unique identifier of the generation.
          examples:
          - JWr5N6X9ZTqf8jD2LmQb
        status:
          type: string
          const: completed
          title: Status
          description: The lifecycle status of the generation.
          examples:
          - completed
        content_url:
          type: string
          title: Content Url
          description: A signed URL to download the generated media from. It expires about an hour after this response is returned; fetch the generation again for a fresh URL.
          examples:
          - https://storage.googleapis.com/generations/JWr5N6X9ZTqf8jD2LmQb
        content_mime_type:
          type: string
          title: Content Mime Type
          description: The MIME type of the generated media.
          examples:
          - video/mp4
          - image/png
          - audio/mpeg
      type: object
      required:
      - id
      - status
      - content_url
      - content_mime_type
      title: MediaGenerationCompletedResponse
      description: A completed media generation and its output.
      example:
        content_mime_type: video/mp4
        content_url: https://storage.googleapis.com/generations/JWr5N6X9ZTqf8jD2LmQb
        id: JWr5N6X9ZTqf8jD2LmQb
        status: completed
    Gemini25FlashImageRequest:
      properties:
        webhook:
          anyOf:
          - $ref: '#/components/schemas/WebhookTarget'
          - type: 'null'
          description: Include to send the generation's result to the workspace's configured flows webhooks once it completes or fails. The webhook payload matches the terminal response of the corresponding GET endpoint.
          examples:
          - type: all
          - ids:
            - Q8mVr2LpXcT4nB6yJdKw
            type: ids
        prompt:
          type: string
          title: Prompt
          description: A text description of the image to generate.
          examples:
          - A corgi in a tiny lifeguard chair on a sunlit beach at golden hour, photorealistic
        model_id:
          type: string
          const: gemini-2.5-flash-image
          title: Model Id
          description: The model to use for the generation.
        images:
          items:
            $ref: '#/components/schemas/ImageReference'
          type: array
          maxItems: 5
          title: Images
          description: Up to 5 reference images to edit or draw from.
        aspect_ratio:
          type: string
          enum:
          - auto
          - '1:1'
          - '2:3'
          - '3:2'
          - '3:4'
          - '4:3'
          - '4:5'
          - '5:4'
          - '9:16'
          - '16:9'
          - '21:9'
          title: Aspect Ratio
