openapi: 3.2.0
info:
  title: ElevenLabs API Documentation Flows API
  description: This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically, this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.
  version: '1.0'
tags:
- name: Flows
paths:
  /v1/flows/video:
    post:
      tags:
      - Flows
      summary: Create Video Generation
      description: Start a video generation with the selected model.
      operationId: create_video_generation
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoGenerationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGenerationCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - flows
      - video
      x-fern-sdk-method-name: create
    get:
      tags:
      - Flows
      summary: List Video Generations
      description: List the video generations created through this API, newest first.
      operationId: list_video_generations
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Pagination cursor: the `next_cursor` value of the previous page''s response. Omit it for the first page.'
          title: Cursor
        description: 'Pagination cursor: the `next_cursor` value of the previous page''s response. Omit it for the first page.'
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: How many generations to return per page.
          default: 30
          title: Page Size
        description: How many generations to return per page.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - pending
            - generating
            - completed
            - failed
            type: string
          - type: 'null'
          description: Only return generations with this lifecycle status.
          title: Status
        description: Only return generations with this lifecycle status.
      - name: model_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only return generations of this model.
          title: Model Id
        description: Only return generations of this model.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGenerationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - flows
      - video
      x-fern-sdk-method-name: list
  /v1/flows/video/{generation_id}:
    get:
      tags:
      - Flows
      summary: Get Video Generation
      description: Retrieve the status of a video generation, and retrieve its output URL once completed.
      operationId: get_video_generation
      parameters:
      - name: generation_id
        in: path
        required: true
        schema:
          type: string
          title: Generation Id
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGenerationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - flows
      - video
      x-fern-sdk-method-name: get
