      operationId: list_image_generations
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Pagination cursor: the `next_cursor` value of the previous page''s response. Omit it for the first page.'
          title: Cursor
        description: 'Pagination cursor: the `next_cursor` value of the previous page''s response. Omit it for the first page.'
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: How many generations to return per page.
          default: 30
          title: Page Size
        description: How many generations to return per page.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - pending
            - generating
            - completed
            - failed
            type: string
          - type: 'null'
          description: Only return generations with this lifecycle status.
          title: Status
        description: Only return generations with this lifecycle status.
      - name: model_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only return generations of this model.
          title: Model Id
        description: Only return generations of this model.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGenerationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - flows
      - image
      x-fern-sdk-method-name: list
  /v1/flows/image/{generation_id}:
    get:
      tags:
      - Flows
      summary: Get Image Generation
      description: Retrieve the status of an image generation, and retrieve its output URL once completed.
      operationId: get_image_generation
      parameters:
      - name: generation_id
        in: path
        required: true
        schema:
          type: string
          title: Generation Id
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGenerationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - flows
      - image
      x-fern-sdk-method-name: get
  /v1/flows/text-to-speech:
    post:
      tags:
      - Flows
      summary: Create Speech Generation
      description: Start a speech generation with the selected model. Charged per character via text-to-speech billing. Use this over `/v1/text-to-speech` for the asynchronous generation lifecycle or for models not offered there; for direct, synchronous speech synthesis, prefer `/v1/text-to-speech`.
      operationId: create_text_to_speech_generation
      parameters:
