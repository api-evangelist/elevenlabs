    GenerationReference:
      properties:
        type:
          type: string
          const: generation
          title: Type
        generation_id:
          type: string
          title: Generation Id
          description: The ID of the generation whose output to use, as returned when the generation was created.
          examples:
          - JWr5N6X9ZTqf8jD2LmQb
      additionalProperties: false
      type: object
      required:
      - type
      - generation_id
      title: GenerationReference
      description: The output of a prior generation on this API.
    MediaGenerationCreateResponse:
      properties:
        id:
          type: string
          title: Id
          description: The unique identifier of the generation. Pass it to the corresponding GET endpoint to retrieve the output.
          examples:
          - JWr5N6X9ZTqf8jD2LmQb
        status:
          type: string
          const: pending
          title: Status
          description: A newly created generation is always `pending`.
          examples:
          - pending
      type: object
      required:
      - id
      - status
      title: MediaGenerationCreateResponse
      description: A newly queued media generation; fetch the GET endpoint for the output.
      example:
        id: JWr5N6X9ZTqf8jD2LmQb
        status: pending
    AudioReference:
      oneOf:
      - $ref: '#/components/schemas/GenerationReference'
      - $ref: '#/components/schemas/StaticAssetReference'
      - $ref: '#/components/schemas/InlineAudioReference'
      discriminator:
        propertyName: type
        mapping:
          asset: '#/components/schemas/StaticAssetReference'
          generation: '#/components/schemas/GenerationReference'
          inline_base64: '#/components/schemas/InlineAudioReference'
    InlineImageReference:
      properties:
        type:
          type: string
          const: inline_base64
          title: Type
        content_base64:
          type: string
          maxLength: 34952536
          title: Content Base64
          description: The media file's bytes, base64-encoded (standard alphabet). Up to 25MB decoded.
          examples:
          - iVBORw0KGgoAAAANSUhEUgAA...
        mime_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
          - image/heic
          - image/heif
          title: Mime Type
          description: The MIME type of the encoded image.
      additionalProperties: false
      type: object
      required:
      - type
      - content_base64
      - mime_type
      title: InlineImageReference
      description: 'An image passed inline as base64. The image is stored as an ephemeral

        asset with no guaranteed retention: it may be deleted at any time after

        the generation completes. To keep an input and reuse it across

        generations, upload it via the assets API (`POST /v1/assets`) and pass

        an `asset` reference instead.'
