              $ref: '#/components/schemas/Body_text_to_speech_stream_with_timestamps'
      responses:
        '200':
          description: Stream of transcription chunks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamingAudioChunkWithTimestampsResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name: text_to_speech
      x-fern-sdk-method-name: stream_with_timestamps
      x-fern-streaming: true
components:
  schemas:
    ElevenFlashV2_5Request:
      properties:
        webhook:
          anyOf:
          - $ref: '#/components/schemas/WebhookTarget'
