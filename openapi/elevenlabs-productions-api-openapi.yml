openapi: 3.2.0
info:
  title: ElevenLabs API Documentation Productions API
  description: This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically, this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.
  version: '1.0'
tags:
- name: productions
  description: Access and manage ElevenProductions orders.
paths:
  /v1/productions/orders:
    post:
      tags:
      - productions
      summary: Create Order
      description: Creates a new Productions order in the workspace. The order starts in the open state and can be configured with items before submission.
      operationId: public_create_order
      parameters:
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateOrderRequest'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - productions
      - orders
      x-fern-sdk-method-name: create
    get:
      tags:
      - productions
      summary: List Orders
      description: Lists Productions orders in the workspace. Supports filtering by status and date range, with pagination.
      operationId: public_list_orders
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          description: Maximum number of orders to return per page.
          default: 20
          title: Page Size
        description: Maximum number of orders to return per page.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of orders to skip for pagination.
          default: 0
          title: Offset
        description: Number of orders to skip for pagination.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/OrderState'
          - type: 'null'
          description: Filter orders by one or more statuses.
          title: Status
        description: Filter orders by one or more statuses.
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filter orders created on or after this date.
          title: Start Date
        description: Filter orders created on or after this date.
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filter orders created on or before this date.
          title: End Date
        description: Filter orders created on or before this date.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrdersResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - productions
      - orders
      x-fern-sdk-method-name: list
  /v1/productions/orders/{order_id}:
    get:
      tags:
      - productions
      summary: Get Order
      description: 'Retrieves full details for a Productions order.


        Quote and pricing information may not be available immediately; if you wish to see the quote before submission, you may need to poll the order details until it is ready.'
      operationId: public_get_order
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderId'
          description: The ID of the order.
        description: The ID of the order.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - productions
      - orders
      x-fern-sdk-method-name: get
    patch:
      tags:
      - productions
      summary: Update Order
      description: Updates an open order.
      operationId: public_update_order
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderId'
          description: The ID of the order.
        description: The ID of the order.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Update_order_v1_productions_orders__order_id__patch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - productions
      - orders
      x-fern-sdk-method-name: update
  /v1/productions/orders/{order_id}/media:
    post:
      tags:
      - productions
      summary: Register Media
      description: Registers a media file with an order, either by uploading it directly or by providing a URL to fetch it from. Exactly one of `media` or `media_url` must be provided. The registered media can then be referenced when adding order items.
      operationId: public_register_media
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderId'
          description: The ID of the order to which this media will be attached.
        description: The ID of the order to which this media will be attached.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_Register_media_v1_productions_orders__order_id__media_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterMediaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - productions
      - orders
      - media
      x-fern-sdk-method-name: register
  /v1/productions/orders/{order_id}/media/{media_id}:
    get:
      tags:
      - productions
      summary: Get Media Info
      description: Retrieves metadata and a time-limited download URL for a previously uploaded media file.
      operationId: public_get_media_info
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderId'
          description: The ID of the order.
        description: The ID of the order.
      - name: media_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MediaId'
          description: The ID of the media file.
        description: The ID of the media file.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderMediaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - productions
      - orders
      - media
      x-fern-sdk-method-name: get
  /v1/productions/orders/{order_id}/items:
    post:
      tags:
      - productions
      summary: Upsert Order Item
      description: Adds or updates an order item on an open order. Returns the item ID and the quoted price.
      operationId: public_upsert_order_item
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderId'
          description: The ID of the order.
        description: The ID of the order.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_Upsert_order_item_v1_productions_orders__order_id__items_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertOrderItemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - productions
      - orders
      - items
      x-fern-sdk-method-name: upsert
  /v1/productions/orders/{order_id}/items/{item_id}:
    delete:
      tags:
      - productions
      summary: Remove Order Item
      description: Removes an order item from an open order.
      operationId: public_remove_order_item
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderId'
          description: The ID of the order.
        description: The ID of the order.
      - name: item_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ItemId'
          description: The ID of the order item.
        description: The ID of the order item.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveOrderItemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - productions
      - orders
      - items
      x-fern-sdk-method-name: remove
  /v1/productions/orders/{order_id}/submit:
    post:
      tags:
      - productions
      summary: Submit Order
      description: 'Submits an open order for processing. The order must have at least one item. Once submitted, items can no longer be modified.


        Upon submission, the workspace will be charged for the order. The quote is based on information extracted from the uploaded media, such as its duration. The quote may not be available immediately; if you wish to see the quote before submission, you may need to poll the order details until the quote is ready.'
      operationId: public_submit_order
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderId'
          description: The ID of the order.
        description: The ID of the order.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - productions
      - orders
      x-fern-sdk-method-name: submit
  /v1/productions/orders/{order_id}/deliverables:
    get:
      tags:
      - productions
      summary: Get Order Deliverables
      description: Retrieves the delivered files for a completed order. Returns an empty list if the order is not yet completed.
      operationId: public_get_order_deliverables
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderId'
          description: The ID of the order.
        description: The ID of the order.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDeliverablesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - productions
      - orders
      - deliverables
      x-fern-sdk-method-name: list
  /v1/productions/orders/languages/{order_item_kind}:
    get:
      tags:
      - productions
      summary: Get Available Languages
      description: Returns the available languages for a given order item kind.
      operationId: public_get_available_languages
      parameters:
      - name: order_item_kind
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderItemKind'
          description: The kind of order item.
        description: The kind of order item.
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguagesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - productions
      - orders
      - languages
      x-fern-sdk-method-name: list
components:
  schemas:
    MediaId:
      type: string
      pattern: ^prodmedia_[a-z0-9]{26}$
    PairedLanguagesResponse:
      properties:
        kind:
          type: string
          const: pair
          title: Kind
          description: Indicates this response contains source-to-destination language pairs.
          default: pair
        language_pairs:
          items:
            $ref: '#/components/schemas/LanguagePairInfo'
          type: array
          title: Language Pairs
          description: The list of available source-to-destination language mappings.
      type: object
      required:
      - language_pairs
      title: PairedLanguagesResponse
      example:
        kind: pair
        language_pairs:
        - destination_languages:
          - code: es
            label: Spanish
          - code: es-ES
            label: Spanish (Spain)
          - code: fr
            label: French
          source_language:
            code: en
            label: English
        - destination_languages:
          - code: en
            label: English
          source_language:
            code: es-ES
            label: Spanish (Spain)
    SingleLanguagesResponse:
      properties:
        kind:
          type: string
          const: single
          title: Kind
          description: Indicates this response contains single languages (not source-to-destination pairs).
          default: single
        languages:
          items:
            $ref: '#/components/schemas/LanguageInfo'
          type: array
          title: Languages
          description: The list of available languages.
      type: object
      required:
      - languages
      title: SingleLanguagesResponse
      example:
        kind: single
        languages:
        - code: en
          label: English
        - code: es-ES
          label: Spanish (Spain)
        - code: fr
          label: French
    OrderId:
      type: string
      pattern: ^prodorder_[a-z0-9]{26}$
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Body_Update_order_v1_productions_orders__order_id__patch:
      properties:
        request:
          $ref: '#/components/schemas/UpdateOrderRequest'
      type: object
      required:
      - request
      title: Body_Update_order_v1_productions_orders__order_id__patch
    OrderItemKind:
      type: string
      enum:
      - dub
      - subtitles
      - transcription
      title: OrderItemKind
    SubmitOrderResponse:
      properties:
        order_id:
          $ref: '#/components/schemas/OrderId'
          description: The ID of the submitted order.
        state:
          $ref: '#/components/schemas/OrderState'
          description: The current state of the order after submission.
        submitted_at:
          type: string
          format: date-time
          title: Submitted At
          description: The timestamp when the order was submitted.
      type: object
      required:
      - order_id
      - state
      - submitted_at
      title: SubmitOrderResponse
      example:
        order_id: prodorder_01jgatk6h0fwxrtbjade61yqhx
        state: submitted
        submitted_at: '2025-03-15T10:30:00Z'
    LanguagesResponse:
      oneOf:
      - $ref: '#/components/schemas/PairedLanguagesResponse'
      - $ref: '#/components/schemas/SingleLanguagesResponse'
      discriminator:
        propertyName: kind
        mapping:
          pair: '#/components/schemas/PairedLanguagesResponse'
          single: '#/components/schemas/SingleLanguagesResponse'
    DubOrderItemRequest:
      properties:
        kind:
          type: string
          const: dub
          title: Kind
          description: The type of order item.
          default: dub
        media_id:
          $ref: '#/components/schemas/MediaId'
          description: The ID of the uploaded media file to dub.
        source_language:
          type: string
          title: Source Language
          description: The language code of the source media (e.g. 'en', 'es').
        destination_languages:
          items:
            type: string
          type: array
          title: Destination Languages
          description: List of target language codes to dub the media into.
        include_captions:
          type: boolean
          title: Include Captions
          description: Whether to generate captions for the dubbed outputs.
        include_source_captions:
          type: boolean
          title: Include Source Captions
          description: Whether to generate captions for the source language.
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
          description: Optional free-text instructions for the dubbing team.
        captions_sdh:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Captions Sdh
          description: Whether captions should use SDH format, which includes descriptions for deaf and hard-of-hearing viewers.
      type: object
      required:
      - media_id
      - source_language
      - destination_languages
      - include_captions
      - include_source_captions
      title: DubOrderItemRequest
      example:
        captions_sdh: false
        destination_languages:
        - hi
        - fr-FR
        - de
        include_captions: true
        include_source_captions: false
        instructions: Voices don't need to match the originals, prioritize native-sounding voices
        kind: dub
        media_id: prodmedia_01jgatk6h0fwxrtbjade61yqhx
        source_language: en
    OrderMediaResponse:
      properties:
        media_id:
          $ref: '#/components/schemas/MediaId'
          description: The ID of the media file.
        name:
          type: string
          title: Name
          description: The original filename of the uploaded media.
        content_type:
          type: string
          title: Content Type
          description: The MIME type of the media file (e.g. 'video/mp4').
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
          description: The detected or declared language of the media, if available.
        signed_url:
          type: string
          title: Signed Url
          description: A time-limited URL to download the media file.
      type: object
      required:
      - media_id
      - name
      - content_type
      - signed_url
      title: OrderMediaResponse
      example:
        content_type: video/mp4
        language: en
        media_id: prodmedia_01jgb2zd68f8f9tfvbb968wb8z
        name: example.mp4
        signed_url: https://storage.googleapis.com/example-bucket/media/example.mp4?X-Goog-Signature=...
    CreateOrderRequest:
      properties:
        sandbox:
          type: boolean
          title: Sandbox
          description: When true, creates a sandbox order that auto-progresses without producer intervention.
          default: false
      type: object
      title: CreateOrderRequest
      example:
        sandbox: false
    TranscriptionOrderItemRequest:
      properties:
        kind:
          type: string
          const: transcription
          title: Kind
          description: The type of order item.
          default: transcription
        media_ids:
          items:
            $ref: '#/components/schemas/MediaId'
          type: array
          title: Media Ids
          description: The IDs of the uploaded media files to transcribe.
        source_language:
          type: string
          title: Source Language
          description: The language code of the source media (e.g. 'en', 'es').
        verbatim:
          type: boolean
          title: Verbatim
          description: Whether to transcribe every word exactly, including filler words.
          default: false
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
          description: Optional free-text instructions for the transcription team.
      type: object
      required:
      - media_ids
      - source_language
      title: TranscriptionOrderItemRequest
      example:
        instructions: Use speaker labels where possible.
        kind: transcription
        media_ids:
        - prodmedia_01jgatk6h0fwxrtbjade61yqhx
        - prodmedia_01jgb2zd68f8f9tfvbb968wb8z
        source_language: en
        verbatim: false
    UpdateOrderRequest:
