openapi: 3.2.0
info:
  title: ElevenLabs API Documentation Agents Workspace Analytics API
  description: This is the documentation for the ElevenLabs API. You can use this API to use our service programmatically, this is done by using your API key. You can find your API key in the dashboard at https://elevenlabs.io/app/settings/api-keys.
  version: '1.0'
tags:
- name: Agents Workspace Analytics
  description: Workspace-level analytics for Conversational AI usage.
paths:
  /v1/convai/conversations/{conversation_id}/analysis/run:
    post:
      tags:
      - Agents Workspace Analytics
      summary: Run Conversation Analysis
      description: Run the analysis for a conversation using the agent's current evaluation criteria and data collection settings.
      operationId: run_conversation_analysis
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the conversation
          title: Conversation Id
        description: ID of the conversation
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConversationResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - conversational_ai
      - conversations
      - analysis
      x-fern-sdk-method-name: run
  /v1/convai/conversations/{conversation_id}/analysis/evaluations/run:
    post:
      tags:
      - Agents Workspace Analytics
      summary: Run Conversation Evaluation
      description: Rerun a specific evaluation for a conversation.
      operationId: run_conversation_evaluations
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the conversation
          title: Conversation Id
        description: ID of the conversation
      - name: xi-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
          title: Xi-Api-Key
        description: Your API key. This is required by most endpoints to access our API programmatically. You can view your xi-api-key using the 'Profile' tab on the website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunConversationEvaluationsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConversationResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-fern-sdk-group-name:
      - conversational_ai
      - conversations
      - analysis
      x-fern-sdk-method-name: runEvaluation
components:
  schemas:
    WorkflowToolEdgeStepModel:
      properties:
        step_latency_secs:
          type: number
          title: Step Latency Secs
        type:
          type: string
          const: edge
          title: Type
          default: edge
        edge_id:
          type: string
          title: Edge Id
        target_node_id:
          type: string
          title: Target Node Id
      type: object
      required:
      - step_latency_secs
      - edge_id
      - target_node_id
      title: WorkflowToolEdgeStepModel
    GetConversationResponseModel:
      properties:
        agent_id:
          type: string
          title: Agent Id
        agent_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Name
        conversation_product:
          type: string
          title: Conversation Product
          default: agent
        status:
          type: string
          enum:
          - initiated
          - in-progress
          - processing
          - done
          - failed
          title: Status
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        branch_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Branch Id
        version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Version Id
          description: The ID of the agent version used for this conversation
        metadata:
          $ref: '#/components/schemas/ConversationHistoryMetadataCommonModel'
        analysis:
          anyOf:
          - $ref: '#/components/schemas/ConversationHistoryAnalysisCommonModel'
          - type: 'null'
        visited_agents:
          items:
            $ref: '#/components/schemas/VisitedAgentRef'
          type: array
          title: Visited Agents
        conversation_initiation_client_data:
          $ref: '#/components/schemas/ConversationInitiationClientDataRequest-Output'
        environment:
          type: string
          title: Environment
          default: production
        conversation_id:
          type: string
          title: Conversation Id
        has_audio:
          type: boolean
          title: Has Audio
        has_user_audio:
          type: boolean
          title: Has User Audio
        has_response_audio:
          type: boolean
          title: Has Response Audio
        has_auxiliary_audio:
          type: boolean
          title: Has Auxiliary Audio
        transcript:
          items:
            $ref: '#/components/schemas/ConversationHistoryTranscriptResponseModel'
          type: array
          title: Transcript
        tag_ids:
          items:
            type: string
          type: array
          title: Tag Ids
          description: Conversation tag ids assigned to this conversation.
        otlp_traces:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: OpenTelemetry trace payload when the request uses format=opentelemetry; otherwise omitted.
      type: object
      required:
      - agent_id
      - status
      - metadata
      - conversation_id
      - has_audio
      - has_user_audio
      - has_response_audio
      - has_auxiliary_audio
      - transcript
      title: GetConversationResponseModel
      example:
        agent_id: agent_3701k3ttaq12ewp8b7qv5rfyszkz
        agent_name: My agent
        conversation_id: conv_7401k5m9x2p8ec3rqv6dtnhb0fzw
        environment: production
        has_audio: true
        has_auxiliary_audio: true
        has_response_audio: true
        has_user_audio: true
        metadata:
          call_duration_secs: 10
          start_time_unix_secs: 1714423232
        status: processing
        tag_ids: []
        transcript:
        - message: Hello, how are you?
          role: user
          time_in_call_secs: 10
        version_id: agtvrsn_5xM3yVvZQKV0EfqQpLr2
    ConversationHistoryExotelPhoneCallModel:
      properties:
        direction:
          $ref: '#/components/schemas/TelephonyDirection'
        phone_number_id:
          type: string
          title: Phone Number Id
        agent_number:
          type: string
          title: Agent Number
        external_number:
          type: string
          title: External Number
        type:
          type: string
          const: exotel
          title: Type
          default: exotel
        stream_sid:
          type: string
          title: Stream Sid
        call_sid:
          type: string
          title: Call Sid
      type: object
      required:
      - direction
      - phone_number_id
      - agent_number
      - external_number
      - stream_sid
      - call_sid
      title: ConversationHistoryExotelPhoneCallModel
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    EndProcedureToolResultSuccessModel:
      properties:
        result_type:
          type: string
          const: end_procedure_success
          title: Result Type
          default: end_procedure_success
        status:
          type: string
          const: success
          title: Status
          default: success
        procedure_id:
          type: string
          title: Procedure Id
        procedure_name:
          type: string
          title: Procedure Name
        message:
          type: string
          title: Message
          default: ''
      type: object
      required:
      - procedure_id
      - procedure_name
      title: EndProcedureToolResultSuccessModel
    TelephonyDirection:
      type: string
      enum:
      - inbound
      - outbound
      title: TelephonyDirection
      default: inbound
    LLMUsage-Output:
      properties:
        model_usage:
          additionalProperties:
            $ref: '#/components/schemas/LLMInputOutputTokensUsage'
          propertyNames:
            $ref: '#/components/schemas/LLM'
          type: object
          title: Model Usage
      type: object
      title: LLMUsage
    ConversationHistoryTranscriptOtherToolsResultCommonModel:
      properties:
        request_id:
          type: string
          title: Request Id
        tool_name:
          type: string
          title: Tool Name
        result_value:
          type: string
          title: Result Value
        is_error:
          type: boolean
          title: Is Error
        is_blocked:
          type: boolean
          title: Is Blocked
          default: false
        tool_has_been_called:
          type: boolean
          title: Tool Has Been Called
        tool_latency_secs:
          type: number
          title: Tool Latency Secs
          default: 0
        error_type:
          type: string
          title: Error Type
          default: ''
        raw_error_message:
          type: string
          title: Raw Error Message
          default: ''
        dynamic_variable_updates:
          items:
            $ref: '#/components/schemas/DynamicVariableUpdateCommonModel'
          type: array
          title: Dynamic Variable Updates
        type:
          anyOf:
          - type: string
            enum:
            - client
            - webhook
            - mcp
            - code
          - type: 'null'
          title: Type
      type: object
      required:
      - request_id
      - tool_name
      - result_value
      - is_error
      - tool_has_been_called
      title: ConversationHistoryTranscriptOtherToolsResultCommonModel
    SMSConversationInfo:
      properties:
        direction:
          type: string
          enum:
          - inbound
          - outbound
          title: Direction
        phone_number_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number Id
        sms_user_phone_number:
          type: string
          title: Sms User Phone Number
        agent_phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Phone Number
      type: object
      required:
      - direction
      - sms_user_phone_number
      title: SMSConversationInfo
    AuthorizationMethod:
      type: string
      enum:
      - invalid
      - public
      - authorization_header
      - signed_url
      - shareable_link
      - livekit_token
      - livekit_token_website
      - genesys_api_key
      - avaya_api_key
      - audiocodes_api_key
      - whatsapp
      - sms
      title: AuthorizationMethod
      default: public
    GuardrailType:
      type: string
      enum:
      - custom
      - prompt_injection
      - self_harm_intent
      - violence_graphic
      - sexual
      - violence
      - harassment
      - sexual_minors
      - self_harm
      - self_harm_instructions
      - harassment_threatening
      - hate
      - hate_threatening
      - profanity
      - religion_or_politics
      - medical_and_legal
      - guardrail
      title: GuardrailType
    FeatureStatusCommonModel:
      properties:
        enabled:
          type: boolean
          title: Enabled
          default: false
        used:
          type: boolean
          title: Used
          default: false
      type: object
      title: FeatureStatusCommonModel
    ConversationHistoryTranscriptWorkflowToolsResultCommonModel-Output:
      properties:
        request_id:
          type: string
          title: Request Id
        tool_name:
          type: string
          title: Tool Name
        result_value:
          type: string
          title: Result Value
        is_error:
          type: boolean
          title: Is Error
        is_blocked:
          type: boolean
          title: Is Blocked
          default: false
        tool_has_been_called:
          type: boolean
          title: Tool Has Been Called
        tool_latency_secs:
          type: number
          title: Tool Latency Secs
          default: 0
        error_type:
          type: string
          title: Error Type
          default: ''
        raw_error_message:
          type: string
          title: Raw Error Message
          default: ''
        dynamic_variable_updates:
          items:
            $ref: '#/components/schemas/DynamicVariableUpdateCommonModel'
          type: array
          title: Dynamic Variable Updates
        type:
          type: string
          const: workflow
          title: Type
        result:
          anyOf:
          - $ref: '#/components/schemas/WorkflowToolResponseModel-Output'
          - type: 'null'
      type: object
      required:
      - request_id
      - tool_name
      - result_value
      - is_error
      - tool_has_been_called
      - type
      title: ConversationHistoryTranscriptWorkflowToolsResultCommonModel
    ChatSourceMedium:
      type: string
      enum:
      - audio
      - dtmf
      - text
      - image
      - file
      title: ChatSourceMedium
    DocumentUsageModeEnum:
      type: string
      enum:
      - prompt
      - auto
      title: DocumentUsageModeEnum
      default: auto
    UserFeedback:
      properties:
        score:
          $ref: '#/components/schemas/UserFeedbackScore'
        time_in_call_secs:
          type: integer
          title: Time In Call Secs
      type: object
      required:
      - score
      - time_in_call_secs
      title: UserFeedback
    MetricRecord:
      properties:
        elapsed_time:
          type: number
          title: Elapsed Time
      type: object
      required:
      - elapsed_time
      title: MetricRecord
    WorkflowToolMaxIterationsExceededStepModel:
      properties:
        step_latency_secs:
          type: number
          title: Step Latency Secs
        type:
          type: string
          const: max_iterations_exceeded
          title: Type
          default: max_iterations_exceeded
        max_iterations:
          type: integer
          title: Max Iterations
      type: object
      required:
      - step_latency_secs
      - max_iterations
      title: WorkflowToolMaxIterationsExceededStepModel
    DataCollectionResultCommonModel:
      properties:
        data_collection_id:
          type: string
          title: Data Collection Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        value:
          title: Value
        json_schema:
          anyOf:
          - $ref: '#/components/schemas/LiteralJsonSchemaProperty'
          - type: 'null'
        rationale:
          type: string
          title: Rationale
      type: object
      required:
      - data_collection_id
      - rationale
      title: DataCollectionResultCommonModel
    ConversationChargingCommonModel:
      properties:
        dev_discount:
          type: boolean
          title: Dev Discount
          default: false
        is_burst:
          type: boolean
          title: Is Burst
          default: false
        tier:
          anyOf:
          - type: string
          - type: 'null'
          title: Tier
        llm_usage:
          $ref: '#/components/schemas/LLMCategoryUsage'
        llm_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Llm Price
        llm_charge:
          anyOf:
          - type: integer
          - type: 'null'
          title: Llm Charge
        call_charge:
          anyOf:
          - type: integer
          - type: 'null'
          title: Call Charge
        platform_charge:
          anyOf:
          - type: integer
          - type: 'null'
          title: Platform Charge
        platform_usage:
          $ref: '#/components/schemas/PlatformUsage'
        platform_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Platform Price
        free_minutes_consumed:
          type: number
          title: Free Minutes Consumed
          default: 0.0
        free_llm_dollars_consumed:
          type: number
          title: Free Llm Dollars Consumed
          default: 0.0
        tts_usage:
          anyOf:
          - $ref: '#/components/schemas/ConversationTTSUsageModel'
          - type: 'null'
        asr_usage:
          anyOf:
          - $ref: '#/components/schemas/ConversationASRUsageModel'
          - type: 'null'
        analysis:
          anyOf:
          - $ref: '#/components/schemas/AnalysisCharging'
          - type: 'null'
      type: object
      title: ConversationChargingCommonModel
    ConversationFeedbackType:
      type: string
      enum:
      - thumbs
      - rating
      title: ConversationFeedbackType
    PlayDTMFResultSuccessModel:
      properties:
        result_type:
          type: string
          const: play_dtmf_success
          title: Result Type
          default: play_dtmf_success
        status:
          type: string
          const: success
          title: Status
          default: success
        dtmf_tones:
          type: string
          title: Dtmf Tones
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      required:
      - dtmf_tones
      title: PlayDTMFResultSuccessModel
    ConversationHistoryMultivoiceMessageModel:
      properties:
        parts:
          items:
            $ref: '#/components/schemas/ConversationHistoryMultivoiceMessagePartModel'
          type: array
          title: Parts
      type: object
      required:
      - parts
      title: ConversationHistoryMultivoiceMessageModel
      description: Represents a message from a multi-voice agent.
    VisitedAgentRef:
      properties:
        agent_id:
          type: string
          title: Agent Id
        branch_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Branch Id
      type: object
      required:
      - agent_id
      title: VisitedAgentRef
      description: An agent (and optional branch) that participated in the call, in first-seen transcript order.
    RagChunkMetadata:
      properties:
        document_id:
          type: string
          title: Document Id
        chunk_id:
          type: string
          title: Chunk Id
        vector_distance:
          type: number
          title: Vector Distance
      type: object
      required:
      - document_id
      - chunk_id
      - vector_distance
      title: RagChunkMetadata
    AgentConfigOverride-Output:
      properties:
        first_message:
          anyOf:
          - type: string
          - type: 'null'
          title: First Message
          description: If non-empty, the first message the agent will say. If empty, the agent waits for the user to start the discussion.
          x-convai-client-override: true
          x-convai-language-override: true
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
          description: Language of the agent - used for ASR and TTS
          x-convai-client-override: true
        max_conversation_duration_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Max Conversation Duration Message
          description: If non-empty, the message the agent will send when max conversation duration is reached.
          x-convai-client-override: true
          x-convai-language-override: true
        prompt:
          anyOf:
          - $ref: '#/components/schemas/PromptAgentAPIModelOverride-Output'
          - type: 'null'
          description: The prompt for the agent
      type: object
      title: AgentConfigOverride
      example:
        first_message: Hello, how can I help you today?
        language: en
        prompt:
          knowledge_base: []
          llm: gemini-2.0-flash-001
          prompt: You are a helpful assistant that can answer questions about the topic of the conversation.
          tool_ids: []
    WorkflowToolResponseModel-Output:
      properties:
        steps:
          items:
            oneOf:
            - $ref: '#/components/schemas/WorkflowToolEdgeStepModel'
            - $ref: '#/components/schemas/WorkflowToolNestedToolsStepModel-Output'
            - $ref: '#/components/schemas/WorkflowToolMaxIterationsExceededStepModel'
            discriminator:
              propertyName: type
              mapping:
                edge: '#/components/schemas/WorkflowToolEdgeStepModel'
                max_iterations_exceeded: '#/components/schemas/WorkflowToolMaxIterationsExceededStepModel'
                nested_tools: '#/components/schemas/WorkflowToolNestedToolsStepModel-Output'
          type: array
          title: Steps
      type: object
      title: WorkflowToolResponseModel
      description: A common model for workflow tool responses.
    TransferToAgentToolResultSuccessModel-Output:
      properties:
        result_type:
          type: string
          const: transfer_to_agent_success
          title: Result Type
          default: transfer_to_agent_success
        status:
          type: string
          const: success
          title: Status
          default: success
        from_agent:
          type: string
          title: From Agent
        to_agent:
          type: string
          title: To Agent
        to_node:
          anyOf:
          - type: string
          - type: 'null'
          title: To Node
        condition:
          type: string
          title: Condition
        delay_ms:
          type: integer
          title: Delay Ms
          default: 0
        transfer_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Transfer Message
        enable_transferred_agent_first_message:
          type: boolean
          title: Enable Transferred Agent First Message
          default: false
        branch_info:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/TransferBranchInfoTrafficSplit'
            - $ref: '#/components/schemas/TransferBranchInfoDefaultingToMain'
            discriminator:
              propertyName: branch_reason
              mapping:
                defaulting_to_main: '#/components/schemas/TransferBranchInfoDefaultingToMain'
                traffic_split: '#/components/schemas/TransferBranchInfoTrafficSplit'
          - type: 'null'
          title: Branch Info
        preserve_client_tts_overrides:
          type: boolean
          title: Preserve Client Tts Overrides
          default: false
      type: object
      required:
      - from_agent
      - to_agent
      - condition
      title: TransferToAgentToolResultSuccessModel
    EndProcedureToolErrorStatus:
      type: string
      enum:
      - not_found
      - invalid_id
    EndCallToolResultModel:
      properties:
        result_type:
          type: string
          const: end_call_success
          title: Result Type
          default: end_call_success
        status:
          type: string
          const: success
          title: Status
          default: success
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
      type: object
      title: EndCallToolResultModel
    KnowledgeBaseLocator:
      properties:
        type:
          $ref: '#/components/schemas/KnowledgeBaseDocumentType'
          description: The type of the knowledge base
        name:
          type: string
          title: Name
          description: The name of the knowledge base
        id:
          type: string
          title: Id
          description: The ID of the knowledge base
        usage_mode:
          $ref: '#/components/schemas/DocumentUsageModeEnum'
          description: The usage mode of the knowledge base
          default: auto
      type: object
      required:
      - type
      - name
      - id
      title: KnowledgeBaseLocator
      example:
        id: '123'
        name: My Knowledge Base
        type: file
        usage_mode: auto
    ASRConversationalConfigOverride:
      properties:
        keywords:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Keywords
          description: Keywords to boost prediction probability for
          x-convai-client-override: true
          x-convai-soft-override-disallowed: true
      type: object
      title: ASRConversationalConfigOverride
      example:
        keywords:
        - hello
        - world
    ConversationTTSUsageModel:
      properties:
        primary_tts_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Primary Tts Model
        total_audio_output_seconds:
          type: number
          title: Total Audio Output Seconds
          default: 0.0
        total_characters:
          type: integer
          title: Total Characters
          default: 0
        per_voice_usage:
          items:
            $ref: '#/components/schemas/ConversationVoiceUsageModel'
          type: array
          title: Per Voice Usage
      type: object
      title: ConversationTTSUsageModel
      description: Aggregated TTS usage for a conversation (analytics-only, not billing).
    TransferBranchInfoDefaultingToMain:
      properties:
        branch_reason:
          type: string
          const: defaulting_to_main
          title: Branch Reason
        branch_id:
          type: string
          title: Branch Id
      type: object
      required:
      - branch_reason
      - branch_id
      title: TransferBranchInfoDefaultingToMain
    StartProcedureToolErrorStatus:
      type: string
      enum:
      - not_found
      - invalid_name
      - already_active
    BatchCallingCampaignInformation:
      properties:
        campaign_id:
          type: string
          title: Campaign Id
        campaign_lead_id:
          type: string
          title: Campaign Lead Id
      type: object
      required:
      - campaign_id
      - campaign_lead_id
