description: |
  Binding between the hosted MCP server's documented capabilities and the REST operations
  that back them.

  CONFIDENCE CAVEAT, read this first: the hosted server's real tool names and inputSchemas
  could not be read — anonymous tools/list is OAuth-gated. The left-hand column is therefore
  the PROVIDER'S PROSE description of each capability, given a descriptive slug by us, NOT a
  tool identifier returned by the server. Bindings are by semantics against operationIds
  verified to exist in the published spec. No confidence above `medium` is claimed for any
  row, because the mapping cannot be confirmed until an authenticated introspection runs.
  Re-run this after an authenticated tools/list and every row can be settled.
surfaces:
  openapi:
    path: openapi/elevenlabs-openapi.json
    url: https://api.elevenlabs.io/openapi.json
    operations: 390
    gated: false
  mcp:
    url: https://api.elevenlabs.io/v1/mcp
    regional:
    - https://api.us.elevenlabs.io/v1/mcp
    - https://api.eu.residency.elevenlabs.io/v1/mcp
    - https://api.in.residency.elevenlabs.io/v1/mcp
    - https://api.sg.residency.elevenlabs.io/v1/mcp
    gated: true
    gate: OAuth 2.0 bearer (RFC 9728 protected resource)
  graphql:
    url: null
    gated: null
    note: ElevenLabs publishes no GraphQL endpoint. The repo's graphql/ directory holds an
      API Evangelist analysis document, not a provider schema.
