rest_only_summary:
  total_rest_operations: 390
  operations_reachable_via_documented_mcp_capabilities: 15
  rest_only_estimate: 375
  note: |
    The hosted MCP server is deliberately narrow. It covers ElevenAgents management plus one
    generation verb; the other ~375 operations — Studio, dubbing, productions, voice cloning,
    music, speech-to-text, the whole workspace/administration surface — have no hosted MCP
    tool. The separate open-source LOCAL server (pypi elevenlabs-mcp) covers more of the
    generation surface; its tool list was not introspected in this pass.
rest_only_families:
- /v1/studio/* (Studio projects, chapters, snapshots)
- /v1/dubbing/* and /v1/productions/*
- /v1/voices/* (including PVC cloning)
- /v1/speech-to-text/*, /v1/speech-to-speech/*, /v1/audio-isolation/*
- /v1/music/*, /v1/sound-generation/*, /v1/text-to-dialogue/*
- /v1/workspace/*, /v1/service-accounts/*, /v1/usage/*
- most of /v1/convai/* beyond agents and conversations (tools, mcp-servers, phone-numbers,
  batch-calling, secrets, testing, triage-tickets)
