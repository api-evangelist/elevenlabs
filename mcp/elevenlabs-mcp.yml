probe:
  url: https://api.us.elevenlabs.io/v1/mcp
  method: POST
  body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
  http_status: 401
  www_authenticate: Bearer resource_metadata="https://api.us.elevenlabs.io/.well-known/oauth-protected-resource"
  response: '{"detail":"OAuth bearer token required for the hosted MCP."}'
  verdict: reachable, first-party, auth-gated. The RFC 9728 challenge is itself the
    strongest evidence this is a real MCP server rather than a guessed path.
tools_note: |
  No machine-readable tool list captured — anonymous tools/list is OAuth-gated. The
  capability list below is the PROVIDER'S OWN prose enumeration from the hosted-MCP doc,
  not an introspected manifest: names and inputSchemas require an authenticated tools/list.
  Do not treat capabilities[] as tool identifiers.
capabilities_documented:
- Create new agents from a natural-language description
- Update any agent setting (system prompt, voice, language, first message)
- List agents and inspect or compare their configurations
- Review an agent's recent conversations and read full transcripts
- Explore the topics an agent's conversations cover
- Duplicate and delete agents
- Estimate an agent's expected LLM usage and cost before making changes
- Retrieve an agent's widget configuration and shareable link
- Check the size of an agent's knowledge base
- Generate speech audio from text, returned as a short-lived download link
capabilities_source: https://elevenlabs.io/docs/eleven-agents/operate/hosted-mcp
safety_notes:
- Deleting an agent is destructive; the provider explicitly tells operators to review tool
  calls before approving them and to restrict write access.
- Workspace administrators can disable individual tools for the whole organization; a tool
  an admin disables cannot be re-enabled by a user.
local_server:
  name: elevenlabs-mcp
  repository: https://github.com/elevenlabs/elevenlabs-mcp
  package: https://pypi.org/project/elevenlabs-mcp/
  version: 0.12.2
  transport: stdio
  auth: api-key
  auth_note: the local server reads ELEVENLABS_API_KEY; the hosted server uses OAuth and
    stores no key in the client.
