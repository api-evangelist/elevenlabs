  checked: '2026-09-17'
  note: |
    BOTH shapes ship, and they are different products. The hosted REMOTE server at
    https://api.elevenlabs.io/v1/mcp is callable by an MCP client today over OAuth with
    nothing installed — Anthropic lists it in the Claude Desktop connector directory. The
    open-source LOCAL stdio server (pypi elevenlabs-mcp 0.12.2,
    github.com/elevenlabs/elevenlabs-mcp) is a separate package a human installs and runs.
    The hosted server covers ElevenAgents management plus Text to Speech; the local server
    covers the generation surface.
